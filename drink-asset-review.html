<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TEATOP 飲料素材對照</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0c2f54;
      --border: #ddd5cb;
      --muted: #5c534a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", sans-serif;
      background: #fff;
      color: #1a1510;
      line-height: 1.45;
    }

    main {
      padding: 1rem;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    thead th {
      background: var(--navy);
      color: #fff;
      font-weight: 600;
      text-align: left;
      padding: 0.75rem 0.65rem;
      white-space: nowrap;
      border: 1px solid #0a2847;
    }

    tbody td {
      vertical-align: middle;
      padding: 0.65rem;
      border: 1px solid var(--border);
    }

    tbody tr:nth-child(even) {
      background: #faf8f5;
    }

    .col-drink .name-zh {
      font-weight: 600;
    }

    .col-drink .name-en {
      margin-top: 0.35rem;
      font-family: Montserrat, "Noto Sans TC", sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.35;
    }

    .img-cell {
      text-align: center;
      width: 120px;
    }

    .img-cell a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 96px;
      height: 96px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
    }

    .img-cell img {
      max-width: 88px;
      max-height: 88px;
      object-fit: contain;
    }

    .img-cell .badge-dot {
      display: inline-block;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .img-cell .badge-caption {
      display: block;
      margin-top: 0.25rem;
      font-size: 0.65rem;
      color: var(--muted);
    }

    .img-cell img.badge-img {
      max-width: 72px;
      max-height: 32px;
      object-fit: contain;
    }

    .img-cell .empty {
      color: var(--muted);
      font-size: 0.85rem;
    }

    thead th.shape-col {
      font-size: 0.78rem;
      white-space: normal;
      max-width: 5.5rem;
      line-height: 1.25;
      vertical-align: bottom;
    }

    .img-cell.shape-slot a {
      width: 88px;
      height: 48px;
    }

    .error-banner {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 1rem;
      margin: 1rem;
      border-radius: 8px;
    }

    @media print {
      main {
        padding: 0;
      }
      thead th {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <main>
    <div id="error" class="error-banner" hidden></div>
    <table aria-label="客戶品項素材對照">
      <thead>
        <tr id="table-head-row">
          <th scope="col">飲料</th>
          <th scope="col">杯圖</th>
          <th scope="col">左裝飾葉</th>
          <th scope="col">右裝飾葉</th>
        </tr>
      </thead>
      <tbody id="table-body" aria-live="polite"></tbody>
    </table>
  </main>
  <script>
    (function () {
      "use strict";

      var REGION = "ximen";
      var ASSET_ROOT = "./";

      function resolveImage(rel) {
        if (!rel) return "";
        if (/^https?:\/\//i.test(rel)) return rel;
        return ASSET_ROOT + rel.replace(/^\.\//, "");
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function menuByZh(menu) {
        var map = Object.create(null);
        (menu.items || []).forEach(function (item) {
          if (!item.nameZh || map[item.nameZh]) return;
          map[item.nameZh] = item;
        });
        return map;
      }

      function shellByNameZh(menu, regionId, shellByRank) {
        var map = Object.create(null);
        (menu.items || []).forEach(function (item) {
          var r = item.regions && item.regions[regionId];
          if (!r || r.rank == null || r.rank > 5) return;
          var shell = shellByRank[String(r.rank)];
          if (shell && item.nameZh) map[item.nameZh] = shell;
        });
        return map;
      }

      function assignmentByNameZh(menu, regionId, byXimenRank, shapeByXimenRank) {
        var map = Object.create(null);
        (menu.items || []).forEach(function (item) {
          var r = item.regions && item.regions[regionId];
          if (!r || r.rank == null || !item.nameZh) return;
          var rankKey = String(r.rank);
          if (!Object.prototype.hasOwnProperty.call(shapeByXimenRank, rankKey)) return;
          map[item.nameZh] = {
            shapeId: shapeByXimenRank[rankKey],
            badge: byXimenRank[rankKey],
          };
        });
        return map;
      }

      function renderShapeHeaders(shapeColumns) {
        var headRow = document.getElementById("table-head-row");
        if (!headRow || !shapeColumns || !shapeColumns.length) return;
        var cupTh = headRow.querySelector("th:nth-child(2)");
        shapeColumns.forEach(function (col) {
          var th = document.createElement("th");
          th.scope = "col";
          th.className = "shape-col";
          th.textContent = col.label || col.id;
          if (cupTh) headRow.insertBefore(th, cupTh);
        });
      }

      function dedupeCatalogItems(items) {
        var seen = Object.create(null);
        var out = [];
        (items || []).forEach(function (entry) {
          var zh = (entry && entry.nameZh) || "";
          if (!zh || seen[zh]) return;
          seen[zh] = true;
          out.push({
            nameZh: zh,
            nameEn: (entry && entry.nameEn) || "",
          });
        });
        return out;
      }

      function showError(msg) {
        var el = document.getElementById("error");
        if (!el) return;
        el.hidden = false;
        el.textContent = msg;
      }

      function imageCell(src, alt) {
        if (!src) {
          return '<td class="img-cell"><span class="empty">—</span></td>';
        }
        var safeSrc = escapeHtml(src);
        var safeAlt = escapeHtml(alt);
        return (
          '<td class="img-cell"><a href="' +
          safeSrc +
          '" target="_blank" rel="noopener" title="開啟原圖">' +
          '<img src="' +
          safeSrc +
          '" alt="' +
          safeAlt +
          '" loading="lazy" /></a></td>'
        );
      }

      function shapeColumnCell(columnId, assignment, alt) {
        if (!assignment || assignment.shapeId !== columnId) {
          return '<td class="img-cell shape-slot"><span class="empty">—</span></td>';
        }
        var badge = assignment.badge;
        if (badge === null || badge === undefined) {
          return '<td class="img-cell shape-slot"><span class="empty">—</span></td>';
        }
        if (badge.type === "colorDot") {
          var color = escapeHtml(badge.color || "#8ab8ba");
          return (
            '<td class="img-cell shape-slot"><span class="badge-dot" style="background-color:' +
            color +
            '" title="CSS 圓點"></span></td>'
          );
        }
        if (badge.type === "image" && badge.url) {
          var safeSrc = escapeHtml(badge.url);
          var safeAlt = escapeHtml(alt);
          return (
            '<td class="img-cell shape-slot"><a href="' +
            safeSrc +
            '" target="_blank" rel="noopener" title="開啟原圖"><img class="badge-img" src="' +
            safeSrc +
            '" alt="' +
            safeAlt +
            '" loading="lazy" /></a></td>'
          );
        }
        return '<td class="img-cell shape-slot"><span class="empty">—</span></td>';
      }

      function buildRow(entry, menuMap, shellMap, assignmentMap, shapeColumns) {
        var menuItem = menuMap[entry.nameZh] || null;
        var shell = shellMap[entry.nameZh] || null;
        var menuImage = menuItem && menuItem.image ? menuItem.image : "";
        var cupSrc = menuImage ? resolveImage(menuImage) : "";
        if (!cupSrc && shell && shell.cupShell) cupSrc = shell.cupShell;
        var leftLeaf = shell && shell.leftLeaf ? shell.leftLeaf : "";
        var rightLeaf = shell && shell.rightLeaf ? shell.rightLeaf : "";
        var nameEn = entry.nameEn || (menuItem && menuItem.nameEn) || "";
        var enHtml = escapeHtml(nameEn).replace(/\n/g, "<br/>");

        var assignment = assignmentMap[entry.nameZh];
        var shapeCells = (shapeColumns || [])
          .map(function (col) {
            return shapeColumnCell(col.id, assignment, entry.nameZh + " " + col.label);
          })
          .join("");

        var tr = document.createElement("tr");
        tr.innerHTML =
          '<td class="col-drink"><div class="name-zh">' +
          escapeHtml(entry.nameZh) +
          '</div><div class="name-en">' +
          enHtml +
          "</div></td>" +
          shapeCells +
          imageCell(cupSrc, entry.nameZh + " 杯圖") +
          imageCell(leftLeaf, entry.nameZh + " 左裝飾葉") +
          imageCell(rightLeaf, entry.nameZh + " 右裝飾葉");
        return tr;
      }

      function boot() {
        Promise.all([
          fetch(ASSET_ROOT + "data/client-drink-catalog.json", { cache: "no-cache" }),
          fetch(ASSET_ROOT + "data/menu.json", { cache: "no-cache" }),
          fetch(ASSET_ROOT + "data/ximen-animation-assets.json", { cache: "no-cache" }),
          fetch(ASSET_ROOT + "data/ximen-name-badge-assets.json", { cache: "no-cache" }),
        ])
          .then(function (responses) {
            if (!responses[0].ok) {
              throw new Error("client-drink-catalog.json HTTP " + responses[0].status);
            }
            if (!responses[1].ok) throw new Error("menu.json HTTP " + responses[1].status);
            if (!responses[2].ok) {
              throw new Error("ximen-animation-assets.json HTTP " + responses[2].status);
            }
            if (!responses[3].ok) {
              throw new Error("ximen-name-badge-assets.json HTTP " + responses[3].status);
            }
            return Promise.all([
              responses[0].json(),
              responses[1].json(),
              responses[2].json(),
              responses[3].json(),
            ]);
          })
          .then(function (payload) {
            var catalog = payload[0];
            var menu = payload[1];
            var shellAssets = payload[2];
            var badgeAssets = payload[3];
            var shellByRank = (shellAssets && shellAssets.ranks) || {};
            var byXimenRank = (badgeAssets && badgeAssets.byXimenRank) || {};
            var shapeByXimenRank = (badgeAssets && badgeAssets.shapeByXimenRank) || {};
            var shapeColumns = (badgeAssets && badgeAssets.shapeColumns) || [];
            renderShapeHeaders(shapeColumns);
            var menuMap = menuByZh(menu);
            var shellMap = shellByNameZh(menu, REGION, shellByRank);
            var assignmentMap = assignmentByNameZh(
              menu,
              REGION,
              byXimenRank,
              shapeByXimenRank
            );
            var items = dedupeCatalogItems(catalog.items);
            var tbody = document.getElementById("table-body");
            if (!tbody) return;
            if (!items.length) {
              showError("客戶品項清單是空的。");
              return;
            }
            items.forEach(function (entry) {
              tbody.appendChild(
                buildRow(entry, menuMap, shellMap, assignmentMap, shapeColumns)
              );
            });
          })
          .catch(function (err) {
            showError(
              "無法載入資料：" +
                (err && err.message ? err.message : String(err)) +
                "。請用 HTTP 開啟此頁（勿直接用 file://）。"
            );
          });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>

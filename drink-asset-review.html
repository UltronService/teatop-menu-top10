<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TEATOP 飲料素材對照 · v1.0</title>
  <meta name="teatop-product-version" content="1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0c2f54;
      --border: #ddd5cb;
      --muted: #5c534a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", sans-serif;
      background: #fff;
      color: #1a1510;
      line-height: 1.45;
    }

    main {
      padding: 1rem;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 960px;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    thead th {
      background: var(--navy);
      color: #fff;
      font-weight: 600;
      text-align: left;
      padding: 0.75rem 0.65rem;
      white-space: nowrap;
      border: 1px solid #0a2847;
    }

    tbody td {
      vertical-align: middle;
      padding: 0.65rem;
      border: 1px solid var(--border);
    }

    tbody tr:nth-child(even) {
      background: #faf8f5;
    }

    .col-drink .name-zh {
      font-weight: 600;
    }

    .col-drink .name-en {
      margin-top: 0.35rem;
      font-family: Montserrat, "Noto Sans TC", sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.35;
    }

    .img-cell {
      text-align: center;
      width: 120px;
    }

    .img-cell a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 96px;
      height: 96px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
    }

    .img-cell img {
      max-width: 88px;
      max-height: 88px;
      object-fit: contain;
    }

    .img-cell .badge-dot,
    button.icon-toggle .badge-dot {
      display: inline-block;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .img-cell .badge-caption {
      display: block;
      margin-top: 0.25rem;
      font-size: 0.65rem;
      color: var(--muted);
    }

    .img-cell img.badge-img {
      max-width: 72px;
      max-height: 32px;
      object-fit: contain;
    }

    .img-cell .empty {
      color: var(--muted);
      font-size: 0.85rem;
    }

    thead th.icon-col {
      font-size: 0.78rem;
      text-align: center;
      white-space: normal;
      max-width: 4.25rem;
      line-height: 1.25;
      vertical-align: bottom;
    }

    thead th.asset-col {
      font-size: 0.85rem;
    }

    tbody td.icon-slot {
      text-align: center;
      width: 4.5rem;
      padding: 0.35rem;
    }

    button.icon-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 3.1rem;
      margin: 0;
      padding: 0.25rem;
      border: 2px dashed #cfc5b8;
      border-radius: 8px;
      background: #f5f3ef;
      cursor: pointer;
      font-family: inherit;
    }

    button.icon-toggle:hover {
      border-color: #ec6f09;
    }

    button.icon-toggle[aria-pressed="true"] {
      border-style: solid;
      border-color: #ec6f09;
      background: #fff8f0;
      box-shadow: inset 0 0 0 1px rgba(236, 111, 9, 0.15);
    }

    button.icon-toggle .toggle-off {
      color: var(--muted);
      font-size: 0.85rem;
    }

    button.icon-toggle img.badge-img {
      pointer-events: none;
    }

    .icon-glyph {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2rem;
      min-height: 2rem;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--navy);
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
    }

    .icon-glyph.gu {
      font-family: "Noto Sans TC", sans-serif;
      font-size: 1.1rem;
    }

    .icon-slot .empty {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .error-banner {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 1rem;
      margin: 1rem;
      border-radius: 8px;
    }

    button.leaf-picker {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 5.5rem;
      margin: 0;
      padding: 0.35rem;
      border: 2px dashed #cfc5b8;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-family: inherit;
      gap: 0.25rem;
    }

    button.leaf-picker:hover {
      border-color: #ec6f09;
    }

    button.leaf-picker img {
      max-width: 72px;
      max-height: 56px;
      object-fit: contain;
    }

    button.leaf-picker .leaf-picker-label {
      font-size: 0.62rem;
      color: var(--muted);
      line-height: 1.2;
      max-width: 100%;
    }

    .leaf-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .leaf-modal[hidden] {
      display: none;
    }

    .leaf-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(12, 47, 84, 0.45);
    }

    .leaf-modal-panel {
      position: relative;
      z-index: 1;
      width: min(640px, 100%);
      max-height: min(85vh, 720px);
      overflow: auto;
      background: #fff;
      border-radius: 12px;
      padding: 1rem 1rem 1.25rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    }

    .leaf-modal-panel h2 {
      margin: 0 2rem 0.75rem 0;
      font-size: 1rem;
    }

    .leaf-modal-close {
      position: absolute;
      top: 0.65rem;
      right: 0.65rem;
      border: none;
      background: #f5f3ef;
      border-radius: 6px;
      width: 2rem;
      height: 2rem;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
    }

    .leaf-option-none {
      display: block;
      width: 100%;
      margin-bottom: 0.75rem;
      padding: 0.65rem;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #faf8f5;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
    }

    .leaf-option-none:hover {
      border-color: #ec6f09;
    }

    .leaf-picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
      gap: 0.5rem;
    }

    .leaf-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem 0.35rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.72rem;
      gap: 0.35rem;
    }

    .leaf-option:hover,
    .leaf-option.is-selected {
      border-color: #ec6f09;
      background: #fff8f0;
    }

    .leaf-option img {
      width: 72px;
      height: 56px;
      object-fit: contain;
    }

    @media print {
      main {
        padding: 0;
      }
      thead th {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <main>
    <div id="error" class="error-banner" hidden></div>
    <table aria-label="客戶品項素材對照">
      <thead>
        <tr id="table-head-row">
          <th scope="col">飲料</th>
          <th scope="col" class="asset-col" data-col="cup">杯圖</th>
          <th scope="col" class="asset-col">左裝飾葉</th>
          <th scope="col" class="asset-col">右裝飾葉</th>
        </tr>
      </thead>
      <tbody id="table-body" aria-live="polite"></tbody>
    </table>
    <div id="leaf-picker-modal" class="leaf-modal" hidden role="dialog" aria-modal="true" aria-labelledby="leaf-picker-title">
      <div class="leaf-modal-backdrop" data-leaf-dismiss="1"></div>
      <div class="leaf-modal-panel">
        <button type="button" class="leaf-modal-close" data-leaf-dismiss="1" aria-label="關閉">×</button>
        <h2 id="leaf-picker-title">選擇裝飾葉</h2>
        <button type="button" class="leaf-option-none" data-leaf-id="none">沒有裝飾葉素材</button>
        <div id="leaf-picker-grid" class="leaf-picker-grid"></div>
      </div>
    </div>
  </main>
  <script>
    (function () {
      "use strict";

      var REGION = "ximen";
      var ASSET_ROOT = "./";
      var TOGGLE_STORAGE_KEY = "teatop-drink-icon-toggles-v1";
      var LEAF_STORAGE_KEY = "teatop-drink-leaf-picks-v1";

      var iconColumnDefaults = Object.create(null);
      var leafCatalogList = [];
      var leafById = Object.create(null);
      var leafPickerContext = null;
      var savedLeafPicks = Object.create(null);

      function resolveImage(rel) {
        if (!rel) return "";
        if (/^https?:\/\//i.test(rel)) return rel;
        return ASSET_ROOT + rel.replace(/^\.\//, "");
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function menuByZh(menu) {
        var map = Object.create(null);
        (menu.items || []).forEach(function (item) {
          if (!item.nameZh || map[item.nameZh]) return;
          map[item.nameZh] = item;
        });
        return map;
      }

      function shellByNameZh(menu, regionId, shellByRank) {
        var map = Object.create(null);
        (menu.items || []).forEach(function (item) {
          var r = item.regions && item.regions[regionId];
          if (!r || r.rank == null || r.rank > 5) return;
          var shell = shellByRank[String(r.rank)];
          if (shell && item.nameZh) map[item.nameZh] = shell;
        });
        return map;
      }

      function iconAssignmentsByNameZh(menu, regionId, assignmentsByXimenRank) {
        var map = Object.create(null);
        (menu.items || []).forEach(function (item) {
          var r = item.regions && item.regions[regionId];
          if (!r || r.rank == null || !item.nameZh) return;
          var rankKey = String(r.rank);
          if (!Object.prototype.hasOwnProperty.call(assignmentsByXimenRank, rankKey)) return;
          map[item.nameZh] = assignmentsByXimenRank[rankKey] || {};
        });
        return map;
      }

      function renderIconHeaders(iconColumns) {
        var headRow = document.getElementById("table-head-row");
        if (!headRow || !iconColumns || !iconColumns.length) return;
        var cupTh = headRow.querySelector('th[data-col="cup"]');
        iconColumns.forEach(function (col) {
          var th = document.createElement("th");
          th.scope = "col";
          th.className = "icon-col";
          th.textContent = col.label || col.id;
          if (cupTh) headRow.insertBefore(th, cupTh);
        });
      }

      function dedupeCatalogItems(items) {
        var seen = Object.create(null);
        var out = [];
        (items || []).forEach(function (entry) {
          var zh = (entry && entry.nameZh) || "";
          if (!zh || seen[zh]) return;
          seen[zh] = true;
          out.push({
            nameZh: zh,
            nameEn: (entry && entry.nameEn) || "",
          });
        });
        return out;
      }

      function showError(msg) {
        var el = document.getElementById("error");
        if (!el) return;
        el.hidden = false;
        el.textContent = msg;
      }

      function loadLeafStorage() {
        try {
          var raw = localStorage.getItem(LEAF_STORAGE_KEY);
          if (!raw) return Object.create(null);
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return Object.create(null);
          return parsed;
        } catch (e) {
          return Object.create(null);
        }
      }

      function saveLeafStorage(state) {
        try {
          localStorage.setItem(LEAF_STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          /* ignore */
        }
      }

      function leafStorageKey(nameZh, slot) {
        return nameZh + "|" + slot;
      }

      function indexLeafCatalog(catalog) {
        leafCatalogList = catalog || [];
        leafById = Object.create(null);
        leafCatalogList.forEach(function (item) {
          if (item && item.id) leafById[item.id] = item;
        });
      }

      function leafIdForUrl(url) {
        if (!url) return "none";
        for (var i = 0; i < leafCatalogList.length; i++) {
          if (leafCatalogList[i].url === url) return leafCatalogList[i].id;
        }
        return "none";
      }

      function initialLeafId(nameZh, slot, shell, saved) {
        var key = leafStorageKey(nameZh, slot);
        if (Object.prototype.hasOwnProperty.call(saved, key)) {
          var v = saved[key];
          if (v === "none" || leafById[v]) return v;
        }
        if (!shell) return "none";
        var url = slot === "leftLeaf" ? shell.leftLeaf : shell.rightLeaf;
        return leafIdForUrl(url);
      }

      function renderLeafPickerButton(btn, leafId) {
        btn.innerHTML = "";
        if (!leafId || leafId === "none") {
          var empty = document.createElement("span");
          empty.className = "toggle-off";
          empty.textContent = "—";
          btn.appendChild(empty);
          var cap = document.createElement("span");
          cap.className = "leaf-picker-label";
          cap.textContent = "沒有裝飾葉素材";
          btn.appendChild(cap);
          btn.title = "點擊選擇裝飾葉";
          return;
        }
        var leaf = leafById[leafId];
        if (!leaf) {
          btn.textContent = "—";
          return;
        }
        var img = document.createElement("img");
        img.src = leaf.url;
        img.alt = leaf.label;
        img.loading = "lazy";
        btn.appendChild(img);
        var label = document.createElement("span");
        label.className = "leaf-picker-label";
        label.textContent = leaf.label;
        btn.appendChild(label);
        btn.title = "目前：" + leaf.label + "（點擊更換）";
      }

      function createLeafPickerCell(nameZh, slot, slotLabel, shell, saved) {
        var td = document.createElement("td");
        td.className = "img-cell";
        var leafId = initialLeafId(nameZh, slot, shell, saved);
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "leaf-picker";
        btn.setAttribute("data-drink-zh", nameZh);
        btn.setAttribute("data-leaf-slot", slot);
        btn.setAttribute("data-leaf-id", leafId);
        renderLeafPickerButton(btn, leafId);
        td.appendChild(btn);
        return td;
      }

      function closeLeafPickerModal() {
        var modal = document.getElementById("leaf-picker-modal");
        if (modal) modal.hidden = true;
        leafPickerContext = null;
      }

      function applyLeafSelection(nameZh, slot, leafId, targetBtn) {
        savedLeafPicks[leafStorageKey(nameZh, slot)] = leafId;
        saveLeafStorage(savedLeafPicks);
        var btn = targetBtn;
        if (!btn && typeof CSS !== "undefined" && CSS.escape) {
          btn = document.querySelector(
            'button.leaf-picker[data-drink-zh="' +
              CSS.escape(nameZh) +
              '"][data-leaf-slot="' +
              slot +
              '"]'
          );
        }
        if (btn) {
          btn.setAttribute("data-leaf-id", leafId);
          renderLeafPickerButton(btn, leafId);
        }
      }

      function openLeafPickerModal(nameZh, slot, slotLabel) {
        var modal = document.getElementById("leaf-picker-modal");
        var grid = document.getElementById("leaf-picker-grid");
        var title = document.getElementById("leaf-picker-title");
        if (!modal || !grid || !title) return;
        var currentBtn = document.querySelector(
          'button.leaf-picker[data-drink-zh="' +
            CSS.escape(nameZh) +
            '"][data-leaf-slot="' +
            slot +
            '"]'
        );
        var currentId =
          (currentBtn && currentBtn.getAttribute("data-leaf-id")) || "none";
        leafPickerContext = { nameZh: nameZh, slot: slot, button: currentBtn };
        title.textContent =
          nameZh + " · " + slotLabel + "（共 " + leafCatalogList.length + " 種可選）";
        grid.innerHTML = "";
        leafCatalogList.forEach(function (leaf) {
          var opt = document.createElement("button");
          opt.type = "button";
          opt.className = "leaf-option";
          if (leaf.id === currentId) opt.classList.add("is-selected");
          opt.setAttribute("data-leaf-id", leaf.id);
          opt.innerHTML =
            '<img src="' +
            escapeHtml(leaf.url) +
            '" alt="" loading="lazy" /><span>' +
            escapeHtml(leaf.label) +
            "</span>";
          grid.appendChild(opt);
        });
        modal.hidden = false;
      }

      function wireLeafPickerTable(tbody) {
        if (!tbody) return;
        tbody.addEventListener("click", function (event) {
          var btn = event.target.closest("button.leaf-picker");
          if (!btn || !tbody.contains(btn)) return;
          var nameZh = btn.getAttribute("data-drink-zh") || "";
          var slot = btn.getAttribute("data-leaf-slot") || "";
          var slotLabel = slot === "leftLeaf" ? "左裝飾葉" : "右裝飾葉";
          openLeafPickerModal(nameZh, slot, slotLabel);
        });

        var modal = document.getElementById("leaf-picker-modal");
        if (!modal) return;
        modal.addEventListener("click", function (event) {
          if (event.target.getAttribute("data-leaf-dismiss") === "1") {
            closeLeafPickerModal();
            return;
          }
          var pick = event.target.closest("[data-leaf-id]");
          if (!pick || !leafPickerContext) return;
          var leafId = pick.getAttribute("data-leaf-id") || "none";
          applyLeafSelection(
            leafPickerContext.nameZh,
            leafPickerContext.slot,
            leafId,
            leafPickerContext.button
          );
          closeLeafPickerModal();
        });
      }

      function loadToggleStorage() {
        try {
          var raw = localStorage.getItem(TOGGLE_STORAGE_KEY);
          if (!raw) return Object.create(null);
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return Object.create(null);
          return parsed;
        } catch (e) {
          return Object.create(null);
        }
      }

      function saveToggleStorage(state) {
        try {
          localStorage.setItem(TOGGLE_STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          /* ignore quota / private mode */
        }
      }

      function toggleStorageKey(nameZh, columnId) {
        return nameZh + "|" + columnId;
      }

      function iconDefForColumn(columnId, rowIcons) {
        if (rowIcons && rowIcons[columnId]) return rowIcons[columnId];
        return iconColumnDefaults[columnId] || null;
      }

      function initialToggleOn(nameZh, columnId, rowIcons, saved) {
        var key = toggleStorageKey(nameZh, columnId);
        if (Object.prototype.hasOwnProperty.call(saved, key)) {
          return saved[key] === true;
        }
        return !!(rowIcons && rowIcons[columnId]);
      }

      function renderToggleInner(button, iconDef, isOn) {
        button.innerHTML = "";
        if (!isOn) {
          var off = document.createElement("span");
          off.className = "toggle-off";
          off.textContent = "—";
          button.appendChild(off);
          return;
        }
        if (!iconDef) {
          var missing = document.createElement("span");
          missing.className = "toggle-off";
          missing.textContent = "—";
          button.appendChild(missing);
          return;
        }
        if (iconDef.type === "colorDot") {
          var dot = document.createElement("span");
          dot.className = "badge-dot";
          dot.setAttribute("role", "img");
          dot.setAttribute("aria-label", "●冰飲");
          dot.style.backgroundColor = iconDef.color || "rgb(138, 184, 186)";
          dot.title = iconDef.title || "●冰飲";
          button.appendChild(dot);
          return;
        }
        if (iconDef.type === "glyph" && iconDef.glyph) {
          var glyph = document.createElement("span");
          glyph.className = "icon-glyph";
          if (iconDef.glyph === "固" || iconDef.glyph === "古") glyph.classList.add("gu");
          glyph.textContent = iconDef.glyph;
          glyph.title = iconDef.title || iconDef.glyph;
          button.appendChild(glyph);
          return;
        }
        if (iconDef.type === "image" && iconDef.url) {
          var img = document.createElement("img");
          img.className = "badge-img";
          img.src = iconDef.url;
          img.alt = button.getAttribute("data-drink-zh") || "";
          img.loading = "lazy";
          img.title = iconDef.title || "";
          button.appendChild(img);
        }
      }

      function createIconToggleCell(nameZh, columnId, columnLabel, rowIcons, saved) {
        var td = document.createElement("td");
        td.className = "icon-slot";
        var iconDef = iconDefForColumn(columnId, rowIcons);
        var isOn = initialToggleOn(nameZh, columnId, rowIcons, saved);
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "icon-toggle";
        btn.setAttribute("aria-pressed", isOn ? "true" : "false");
        btn.setAttribute("data-drink-zh", nameZh);
        btn.setAttribute("data-column-id", columnId);
        btn.title = (isOn ? "關閉" : "開啟") + "：" + columnLabel;
        if (iconDef) {
          btn.setAttribute("data-icon-def", JSON.stringify(iconDef));
        }
        renderToggleInner(btn, iconDef, isOn);
        td.appendChild(btn);
        return td;
      }

      function wireIconToggleTable(tbody, saved) {
        if (!tbody) return;
        tbody.addEventListener("click", function (event) {
          var btn = event.target.closest("button.icon-toggle");
          if (!btn || !tbody.contains(btn)) return;
          var isOn = btn.getAttribute("aria-pressed") === "true";
          var next = !isOn;
          var nameZh = btn.getAttribute("data-drink-zh") || "";
          var columnId = btn.getAttribute("data-column-id") || "";
          var iconDef = null;
          try {
            var raw = btn.getAttribute("data-icon-def");
            if (raw) iconDef = JSON.parse(raw);
          } catch (e) {
            iconDef = iconColumnDefaults[columnId] || null;
          }
          if (!iconDef) iconDef = iconColumnDefaults[columnId] || null;
          btn.setAttribute("aria-pressed", next ? "true" : "false");
          var label = btn.title.split("：").pop() || columnId;
          btn.title = (next ? "關閉" : "開啟") + "：" + label;
          renderToggleInner(btn, iconDef, next);
          if (nameZh && columnId) {
            saved[toggleStorageKey(nameZh, columnId)] = next;
            saveToggleStorage(saved);
          }
        });
      }

      function imageCell(src, alt) {
        if (!src) {
          return '<td class="img-cell"><span class="empty">—</span></td>';
        }
        var safeSrc = escapeHtml(src);
        var safeAlt = escapeHtml(alt);
        return (
          '<td class="img-cell"><a href="' +
          safeSrc +
          '" target="_blank" rel="noopener" title="開啟原圖">' +
          '<img src="' +
          safeSrc +
          '" alt="' +
          safeAlt +
          '" loading="lazy" /></a></td>'
        );
      }

      function buildRow(entry, menuMap, shellMap, iconMap, iconColumns, saved, savedLeaves) {
        var menuItem = menuMap[entry.nameZh] || null;
        var shell = shellMap[entry.nameZh] || null;
        var menuImage = menuItem && menuItem.image ? menuItem.image : "";
        var cupSrc = menuImage ? resolveImage(menuImage) : "";
        if (!cupSrc && shell && shell.cupShell) cupSrc = shell.cupShell;
        var nameEn = entry.nameEn || (menuItem && menuItem.nameEn) || "";
        var enHtml = escapeHtml(nameEn).replace(/\n/g, "<br/>");
        var rowIcons = iconMap[entry.nameZh];

        var tr = document.createElement("tr");
        tr.setAttribute("data-drink-zh", entry.nameZh);

        var drinkTd = document.createElement("td");
        drinkTd.className = "col-drink";
        drinkTd.innerHTML =
          '<div class="name-zh">' +
          escapeHtml(entry.nameZh) +
          '</div><div class="name-en">' +
          enHtml +
          "</div>";
        tr.appendChild(drinkTd);

        (iconColumns || []).forEach(function (col) {
          tr.appendChild(
            createIconToggleCell(
              entry.nameZh,
              col.id,
              col.label || col.id,
              rowIcons,
              saved
            )
          );
        });

        var cupWrap = document.createElement("template");
        cupWrap.innerHTML = imageCell(cupSrc, entry.nameZh + " 杯圖");
        tr.appendChild(cupWrap.content.firstChild);

        tr.appendChild(
          createLeafPickerCell(entry.nameZh, "leftLeaf", "左裝飾葉", shell, savedLeaves)
        );
        tr.appendChild(
          createLeafPickerCell(entry.nameZh, "rightLeaf", "右裝飾葉", shell, savedLeaves)
        );

        return tr;
      }

      function boot() {
        Promise.all([
          fetch(ASSET_ROOT + "data/client-drink-catalog.json", { cache: "no-cache" }),
          fetch(ASSET_ROOT + "data/menu.json", { cache: "no-cache" }),
          fetch(ASSET_ROOT + "data/ximen-animation-assets.json", { cache: "no-cache" }),
          fetch(ASSET_ROOT + "data/ximen-name-badge-assets.json", { cache: "no-cache" }),
        ])
          .then(function (responses) {
            if (!responses[0].ok) {
              throw new Error("client-drink-catalog.json HTTP " + responses[0].status);
            }
            if (!responses[1].ok) throw new Error("menu.json HTTP " + responses[1].status);
            if (!responses[2].ok) {
              throw new Error("ximen-animation-assets.json HTTP " + responses[2].status);
            }
            if (!responses[3].ok) {
              throw new Error("ximen-name-badge-assets.json HTTP " + responses[3].status);
            }
            return Promise.all([
              responses[0].json(),
              responses[1].json(),
              responses[2].json(),
              responses[3].json(),
            ]);
          })
          .then(function (payload) {
            var catalog = payload[0];
            var menu = payload[1];
            var shellAssets = payload[2];
            var badgeAssets = payload[3];
            var shellByRank = (shellAssets && shellAssets.ranks) || {};
            var iconColumns = (badgeAssets && badgeAssets.iconColumns) || [];
            var assignmentsByXimenRank =
              (badgeAssets && badgeAssets.assignmentsByXimenRank) || {};
            iconColumnDefaults = (badgeAssets && badgeAssets.iconColumnDefaults) || {};
            indexLeafCatalog(shellAssets.leafCatalog || []);
            savedLeafPicks = loadLeafStorage();
            var savedToggles = loadToggleStorage();
            renderIconHeaders(iconColumns);
            var menuMap = menuByZh(menu);
            var shellMap = shellByNameZh(menu, REGION, shellByRank);
            var iconMap = iconAssignmentsByNameZh(menu, REGION, assignmentsByXimenRank);
            var items = dedupeCatalogItems(catalog.items);
            var tbody = document.getElementById("table-body");
            if (!tbody) return;
            if (!items.length) {
              showError("客戶品項清單是空的。");
              return;
            }
            wireIconToggleTable(tbody, savedToggles);
            wireLeafPickerTable(tbody);
            items.forEach(function (entry) {
              tbody.appendChild(
                buildRow(
                  entry,
                  menuMap,
                  shellMap,
                  iconMap,
                  iconColumns,
                  savedToggles,
                  savedLeafPicks
                )
              );
            });
          })
          .catch(function (err) {
            showError(
              "無法載入資料：" +
                (err && err.message ? err.message : String(err)) +
                "。請用 HTTP 開啟此頁（勿直接用 file://）。"
            );
          });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>

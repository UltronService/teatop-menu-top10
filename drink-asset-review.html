<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TEATOP 飲料素材對照 · v1.0</title>
  <meta name="teatop-product-version" content="1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/antd/5.24.9/reset.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      margin: 0;
      background: #f5f5f5;
    }

    .teatop-page-header-title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.88);
      line-height: 64px;
    }

    .teatop-drink-name-zh {
      font-weight: 600;
      color: rgba(0, 0, 0, 0.88);
    }

    .teatop-drink-name-en {
      margin-top: 4px;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.45);
      line-height: 1.35;
      white-space: pre-line;
    }

    .teatop-thumb-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 88px;
      height: 88px;
      background: #fff;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      overflow: hidden;
    }

    .teatop-thumb-wrap img {
      max-width: 80px;
      max-height: 80px;
      object-fit: contain;
    }

    .teatop-icon-toggle-btn {
      min-width: 56px;
      min-height: 48px;
      height: auto;
      padding: 4px 8px;
      border-style: dashed !important;
    }

    .teatop-icon-toggle-btn.is-on {
      border-style: solid !important;
      border-color: #ec6f09 !important;
      background: #fff8f0 !important;
    }

    .teatop-badge-dot {
      display: inline-block;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid #d9d9d9;
    }

    .teatop-icon-glyph {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      min-height: 32px;
      font-size: 18px;
      font-weight: 700;
      color: #0c2f54;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      background: #fff;
    }

    .teatop-leaf-picker-btn {
      min-height: 96px;
      height: auto;
      flex-direction: column;
      gap: 4px;
      white-space: normal;
      text-align: center;
    }

    .teatop-leaf-picker-btn img {
      max-width: 72px;
      max-height: 56px;
      object-fit: contain;
    }

    .teatop-leaf-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 8px;
      height: auto;
    }

    .teatop-leaf-option img {
      width: 72px;
      height: 56px;
      object-fit: contain;
    }

    .teatop-leaf-option.is-selected {
      border-color: #ec6f09 !important;
      background: #fff8f0 !important;
    }

    .teatop-empty-none-pick {
      cursor: pointer;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px dashed #d9d9d9;
      border-radius: 8px;
      transition: border-color 0.2s;
    }

    .teatop-empty-none-pick:hover {
      border-color: #ec6f09;
    }

    @media print {
      .ant-layout-header {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.13/dayjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/antd/5.24.9/antd.min.js"></script>

  <script>
    (function () {
      "use strict";

      var e = React.createElement;
      var useState = React.useState;
      var useMemo = React.useMemo;
      var useCallback = React.useCallback;

      var Layout = antd.Layout;
      var Header = Layout.Header;
      var Content = Layout.Content;
      var Table = antd.Table;
      var Modal = antd.Modal;
      var Button = antd.Button;
      var Empty = antd.Empty;
      var Alert = antd.Alert;
      var ConfigProvider = antd.ConfigProvider;
      var Space = antd.Space;

      var REGION = "ximen";
      var ASSET_ROOT = "./";
      var TOGGLE_STORAGE_KEY = "teatop-drink-icon-toggles-v1";
      var LEAF_STORAGE_KEY = "teatop-drink-leaf-picks-v1";

      var iconColumnDefaults = Object.create(null);
      var leafCatalogList = [];
      var leafById = Object.create(null);
      var leafPickerContext = null;
      var savedLeafPicks = Object.create(null);

      function resolveImage(rel) {
        if (!rel) return "";
        if (/^https?:\/\//i.test(rel)) return rel;
        return ASSET_ROOT + rel.replace(/^\.\//, "");
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function menuByZh(menu) {
        var map = Object.create(null);
        (menu.items || []).forEach(function (item) {
          if (!item.nameZh || map[item.nameZh]) return;
          map[item.nameZh] = item;
        });
        return map;
      }

      function shellByNameZh(menu, regionId, shellByRank) {
        var map = Object.create(null);
        (menu.items || []).forEach(function (item) {
          var r = item.regions && item.regions[regionId];
          if (!r || r.rank == null || r.rank > 5) return;
          var shell = shellByRank[String(r.rank)];
          if (shell && item.nameZh) map[item.nameZh] = shell;
        });
        return map;
      }

      function iconAssignmentsByNameZh(menu, regionId, assignmentsByXimenRank) {
        var map = Object.create(null);
        (menu.items || []).forEach(function (item) {
          var r = item.regions && item.regions[regionId];
          if (!r || r.rank == null || !item.nameZh) return;
          var rankKey = String(r.rank);
          if (!Object.prototype.hasOwnProperty.call(assignmentsByXimenRank, rankKey)) return;
          map[item.nameZh] = assignmentsByXimenRank[rankKey] || {};
        });
        return map;
      }

      function dedupeCatalogItems(items) {
        var seen = Object.create(null);
        var out = [];
        (items || []).forEach(function (entry) {
          var zh = (entry && entry.nameZh) || "";
          if (!zh || seen[zh]) return;
          seen[zh] = true;
          out.push({
            nameZh: zh,
            nameEn: (entry && entry.nameEn) || "",
          });
        });
        return out;
      }

      function loadLeafStorage() {
        try {
          var raw = localStorage.getItem(LEAF_STORAGE_KEY);
          if (!raw) return Object.create(null);
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return Object.create(null);
          return parsed;
        } catch (err) {
          return Object.create(null);
        }
      }

      function saveLeafStorage(state) {
        try {
          localStorage.setItem(LEAF_STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          /* ignore */
        }
      }

      function leafStorageKey(nameZh, slot) {
        return nameZh + "|" + slot;
      }

      function indexLeafCatalog(catalog) {
        leafCatalogList = catalog || [];
        leafById = Object.create(null);
        leafCatalogList.forEach(function (item) {
          if (item && item.id) leafById[item.id] = item;
        });
      }

      function leafIdForUrl(url) {
        if (!url) return "none";
        for (var i = 0; i < leafCatalogList.length; i++) {
          if (leafCatalogList[i].url === url) return leafCatalogList[i].id;
        }
        return "none";
      }

      function initialLeafId(nameZh, slot, shell, saved) {
        var key = leafStorageKey(nameZh, slot);
        if (Object.prototype.hasOwnProperty.call(saved, key)) {
          var v = saved[key];
          if (v === "none" || leafById[v]) return v;
        }
        if (!shell) return "none";
        var url = slot === "leftLeaf" ? shell.leftLeaf : shell.rightLeaf;
        return leafIdForUrl(url);
      }

      function loadToggleStorage() {
        try {
          var raw = localStorage.getItem(TOGGLE_STORAGE_KEY);
          if (!raw) return Object.create(null);
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return Object.create(null);
          return parsed;
        } catch (err) {
          return Object.create(null);
        }
      }

      function saveToggleStorage(state) {
        try {
          localStorage.setItem(TOGGLE_STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          /* ignore quota / private mode */
        }
      }

      function toggleStorageKey(nameZh, columnId) {
        return nameZh + "|" + columnId;
      }

      function iconDefForColumn(columnId, rowIcons) {
        if (rowIcons && rowIcons[columnId]) return rowIcons[columnId];
        return iconColumnDefaults[columnId] || null;
      }

      function initialToggleOn(nameZh, columnId, rowIcons, saved) {
        var key = toggleStorageKey(nameZh, columnId);
        if (Object.prototype.hasOwnProperty.call(saved, key)) {
          return saved[key] === true;
        }
        return !!(rowIcons && rowIcons[columnId]);
      }

      function renderToggleInnerNodes(iconDef, isOn, drinkZh) {
        if (!isOn) {
          return e("span", { style: { color: "rgba(0,0,0,0.45)" } }, "—");
        }
        if (!iconDef) {
          return e("span", { style: { color: "rgba(0,0,0,0.45)" } }, "—");
        }
        if (iconDef.type === "colorDot") {
          return e("span", {
            className: "teatop-badge-dot",
            role: "img",
            "aria-label": "●冰飲",
            title: iconDef.title || "●冰飲",
            style: { backgroundColor: iconDef.color || "rgb(138, 184, 186)" },
          });
        }
        if (iconDef.type === "glyph" && iconDef.glyph) {
          return e(
            "span",
            {
              className: "teatop-icon-glyph",
              title: iconDef.title || iconDef.glyph,
            },
            iconDef.glyph
          );
        }
        if (iconDef.type === "image" && iconDef.url) {
          return e("img", {
            src: iconDef.url,
            alt: drinkZh || "",
            loading: "lazy",
            title: iconDef.title || "",
            style: { maxWidth: 72, maxHeight: 32, objectFit: "contain" },
          });
        }
        return e("span", { style: { color: "rgba(0,0,0,0.45)" } }, "—");
      }

      function buildTableRows(items, menuMap, shellMap, iconMap, savedToggles, savedLeaves) {
        return items.map(function (entry) {
          var menuItem = menuMap[entry.nameZh] || null;
          var shell = shellMap[entry.nameZh] || null;
          var menuImage = menuItem && menuItem.image ? menuItem.image : "";
          var cupSrc = menuImage ? resolveImage(menuImage) : "";
          if (!cupSrc && shell && shell.cupShell) cupSrc = shell.cupShell;
          var nameEn = entry.nameEn || (menuItem && menuItem.nameEn) || "";
          var rowIcons = iconMap[entry.nameZh];
          return {
            key: entry.nameZh,
            nameZh: entry.nameZh,
            nameEn: nameEn,
            cupSrc: cupSrc,
            shell: shell,
            rowIcons: rowIcons,
            leftLeafId: initialLeafId(entry.nameZh, "leftLeaf", shell, savedLeaves),
            rightLeafId: initialLeafId(entry.nameZh, "rightLeaf", shell, savedLeaves),
            savedToggles: savedToggles,
          };
        });
      }

      function LeafPickerButton(props) {
        var leafId = props.leafId;
        var onOpen = props.onOpen;
        var children;
        if (!leafId || leafId === "none") {
          children = e(
            Empty,
            {
              image: Empty.PRESENTED_IMAGE_SIMPLE,
              description: "沒有裝飾葉素材",
              style: { margin: 0, transform: "scale(0.85)" },
            }
          );
        } else {
          var leaf = leafById[leafId];
          if (!leaf) {
            children = "—";
          } else {
            children = e(
              Space,
              { direction: "vertical", size: 4, align: "center" },
              e("img", { src: leaf.url, alt: leaf.label, loading: "lazy" }),
              e("span", { style: { fontSize: 11, color: "rgba(0,0,0,0.45)" } }, leaf.label)
            );
          }
        }
        var title =
          !leafId || leafId === "none"
            ? "點擊選擇裝飾葉"
            : leafById[leafId]
              ? "目前：" + leafById[leafId].label + "（點擊更換）"
              : "點擊選擇裝飾葉";
        return e(
          Button,
          {
            type: "primary",
            ghost: true,
            className: "teatop-leaf-picker-btn",
            title: title,
            onClick: onOpen,
          },
          children
        );
      }

      function DrinkAssetReviewApp(props) {
        var initialItems = props.items;
        var iconColumns = props.iconColumns;
        var menuMap = props.menuMap;
        var shellMap = props.shellMap;
        var iconMap = props.iconMap;

        var toggleState = useState(props.initialSavedToggles || Object.create(null));
        var savedToggles = toggleState[0];
        var setSavedToggles = toggleState[1];

        var leafState = useState(props.initialSavedLeaves || Object.create(null));
        var savedLeaves = leafState[0];
        var setSavedLeaves = leafState[1];

        var rowSeed = useMemo(
          function () {
            return buildTableRows(
              initialItems,
              menuMap,
              shellMap,
              iconMap,
              savedToggles,
              savedLeaves
            );
          },
          [initialItems, menuMap, shellMap, iconMap, savedToggles, savedLeaves]
        );

        var modalState = useState(null);
        var leafModal = modalState[0];
        var setLeafModal = modalState[1];

        var handleIconToggle = useCallback(
          function (nameZh, columnId, columnLabel, rowIcons) {
            var iconDef = iconDefForColumn(columnId, rowIcons);
            var key = toggleStorageKey(nameZh, columnId);
            var isOn = Object.prototype.hasOwnProperty.call(savedToggles, key)
              ? savedToggles[key] === true
              : !!(rowIcons && rowIcons[columnId]);
            var next = !isOn;
            var nextState = Object.assign(Object.create(null), savedToggles);
            nextState[key] = next;
            setSavedToggles(nextState);
            saveToggleStorage(nextState);
          },
          [savedToggles]
        );

        var openLeafPickerModal = useCallback(function (nameZh, slot, slotLabel) {
          var currentId = savedLeaves[leafStorageKey(nameZh, slot)];
          if (currentId === undefined) {
            var shell = shellMap[nameZh] || null;
            currentId = initialLeafId(nameZh, slot, shell, savedLeaves);
          }
          leafPickerContext = { nameZh: nameZh, slot: slot };
          setLeafModal({
            nameZh: nameZh,
            slot: slot,
            slotLabel: slotLabel,
            currentId: currentId || "none",
            title:
              nameZh +
              " · " +
              slotLabel +
              "（共 " +
              leafCatalogList.length +
              " 種可選）",
          });
        }, [savedLeaves, shellMap]);

        var closeLeafPickerModal = useCallback(function () {
          leafPickerContext = null;
          setLeafModal(null);
        }, []);

        var applyLeafSelection = useCallback(
          function (nameZh, slot, leafId) {
            var nextState = Object.assign(Object.create(null), savedLeaves);
            nextState[leafStorageKey(nameZh, slot)] = leafId;
            savedLeafPicks = nextState;
            setSavedLeaves(nextState);
            saveLeafStorage(nextState);
            closeLeafPickerModal();
          },
          [savedLeaves, closeLeafPickerModal]
        );

        var columns = useMemo(
          function () {
            var cols = [
              {
                title: "飲料",
                dataIndex: "nameZh",
                key: "drink",
                fixed: "left",
                width: 180,
                render: function (_text, record) {
                  return e(
                    "div",
                    null,
                    e("div", { className: "teatop-drink-name-zh" }, record.nameZh),
                    record.nameEn
                      ? e("div", { className: "teatop-drink-name-en" }, record.nameEn)
                      : null
                  );
                },
              },
            ];

            (iconColumns || []).forEach(function (col) {
              cols.push({
                title: col.label || col.id,
                key: "icon-" + col.id,
                align: "center",
                width: 72,
                render: function (_text, record) {
                  var columnId = col.id;
                  var columnLabel = col.label || col.id;
                  var rowIcons = record.rowIcons;
                  var iconDef = iconDefForColumn(columnId, rowIcons);
                  var key = toggleStorageKey(record.nameZh, columnId);
                  var isOn = Object.prototype.hasOwnProperty.call(savedToggles, key)
                    ? savedToggles[key] === true
                    : initialToggleOn(record.nameZh, columnId, rowIcons, savedToggles);
                  var btnClass = "teatop-icon-toggle-btn" + (isOn ? " is-on" : "");
                  return e(
                    Button,
                    {
                      type: "default",
                      className: btnClass,
                      "aria-pressed": isOn ? "true" : "false",
                      title: (isOn ? "關閉" : "開啟") + "：" + columnLabel,
                      onClick: function () {
                        handleIconToggle(record.nameZh, columnId, columnLabel, rowIcons);
                      },
                    },
                    renderToggleInnerNodes(iconDef, isOn, record.nameZh)
                  );
                },
              });
            });

            cols.push({
              title: "杯圖",
              key: "cup",
              align: "center",
              width: 120,
              render: function (_text, record) {
                if (!record.cupSrc) {
                  return e("span", { style: { color: "rgba(0,0,0,0.45)" } }, "—");
                }
                return e(
                  "a",
                  {
                    href: record.cupSrc,
                    target: "_blank",
                    rel: "noopener noreferrer",
                    title: "開啟原圖",
                  },
                  e(
                    "span",
                    { className: "teatop-thumb-wrap" },
                    e("img", {
                      src: record.cupSrc,
                      alt: record.nameZh + " 杯圖",
                      loading: "lazy",
                    })
                  )
                );
              },
            });

            cols.push({
              title: "左裝飾葉",
              key: "leftLeaf",
              align: "center",
              width: 140,
              render: function (_text, record) {
                var leafId =
                  savedLeaves[leafStorageKey(record.nameZh, "leftLeaf")] !== undefined
                    ? savedLeaves[leafStorageKey(record.nameZh, "leftLeaf")]
                    : record.leftLeafId;
                return e(LeafPickerButton, {
                  leafId: leafId,
                  onOpen: function () {
                    openLeafPickerModal(record.nameZh, "leftLeaf", "左裝飾葉");
                  },
                });
              },
            });

            cols.push({
              title: "右裝飾葉",
              key: "rightLeaf",
              align: "center",
              width: 140,
              render: function (_text, record) {
                var leafId =
                  savedLeaves[leafStorageKey(record.nameZh, "rightLeaf")] !== undefined
                    ? savedLeaves[leafStorageKey(record.nameZh, "rightLeaf")]
                    : record.rightLeafId;
                return e(LeafPickerButton, {
                  leafId: leafId,
                  onOpen: function () {
                    openLeafPickerModal(record.nameZh, "rightLeaf", "右裝飾葉");
                  },
                });
              },
            });

            return cols;
          },
          [
            iconColumns,
            savedToggles,
            savedLeaves,
            handleIconToggle,
            openLeafPickerModal,
          ]
        );

        var modalBody = null;
        if (leafModal) {
          if (!leafCatalogList.length) {
            modalBody = e(Empty, { description: "沒有裝飾葉素材" });
          } else {
            modalBody = e(
              "div",
              null,
              e(
                "div",
                {
                  className: "teatop-empty-none-pick",
                  role: "button",
                  tabIndex: 0,
                  onClick: function () {
                    applyLeafSelection(leafModal.nameZh, leafModal.slot, "none");
                  },
                  onKeyDown: function (ev) {
                    if (ev.key === "Enter" || ev.key === " ") {
                      applyLeafSelection(leafModal.nameZh, leafModal.slot, "none");
                    }
                  },
                },
                e(Empty, { description: "沒有裝飾葉素材" })
              ),
              e(
                "div",
                {
                  style: {
                    display: "grid",
                    gridTemplateColumns: "repeat(auto-fill, minmax(108px, 1fr))",
                    gap: 8,
                  },
                },
                leafCatalogList.map(function (leaf) {
                  var selected = leaf.id === leafModal.currentId;
                  return e(
                    Button,
                    {
                      key: leaf.id,
                      className: "teatop-leaf-option" + (selected ? " is-selected" : ""),
                      onClick: function () {
                        applyLeafSelection(leafModal.nameZh, leafModal.slot, leaf.id);
                      },
                    },
                    e("img", { src: leaf.url, alt: "", loading: "lazy" }),
                    e("span", { style: { fontSize: 11 } }, leaf.label)
                  );
                })
              )
            );
          }
        }

        return e(
          ConfigProvider,
          {
            theme: {
              token: {
                colorPrimary: "#ec6f09",
                borderRadius: 8,
              },
            },
          },
          e(
            Layout,
            { style: { minHeight: "100vh", background: "#f5f5f5" } },
            e(
              Header,
              {
                style: {
                  background: "#fff",
                  padding: "0 24px",
                  height: 64,
                  lineHeight: "64px",
                  borderBottom: "1px solid #f0f0f0",
                  position: "sticky",
                  top: 0,
                  zIndex: 10,
                },
              },
              e("h1", { className: "teatop-page-header-title" }, "TEATOP 飲料素材對照 · v1.0")
            ),
            e(
              Content,
              { style: { padding: 24, maxWidth: 1400, margin: "0 auto", width: "100%" } },
              props.errorMessage
                ? e(Alert, {
                    type: "error",
                    message: props.errorMessage,
                    showIcon: true,
                    style: { marginBottom: 16 },
                  })
                : null,
              e(Table, {
                columns: columns,
                dataSource: rowSeed,
                pagination: false,
                bordered: true,
                size: "middle",
                scroll: { x: "max-content" },
                locale: { emptyText: e(Empty, { description: "尚無品項資料" }) },
              })
            ),
            e(Modal, {
              title: leafModal ? leafModal.title : "選擇裝飾葉",
              open: !!leafModal,
              onCancel: closeLeafPickerModal,
              footer: null,
              width: 640,
              destroyOnClose: true,
              children: modalBody,
            })
          )
        );
      }

      function renderAppMount(mountProps) {
        var rootEl = document.getElementById("root");
        if (!rootEl) return;
        var root = ReactDOM.createRoot(rootEl);
        root.render(e(DrinkAssetReviewApp, mountProps));
      }

      function showError(msg) {
        renderAppMount({
          items: [],
          iconColumns: [],
          menuMap: Object.create(null),
          shellMap: Object.create(null),
          iconMap: Object.create(null),
          initialSavedToggles: Object.create(null),
          initialSavedLeaves: Object.create(null),
          errorMessage: msg,
        });
      }

      function boot() {
        Promise.all([
          fetch(ASSET_ROOT + "data/client-drink-catalog.json", { cache: "no-cache" }),
          fetch(ASSET_ROOT + "data/menu.json", { cache: "no-cache" }),
          fetch(ASSET_ROOT + "data/ximen-animation-assets.json", { cache: "no-cache" }),
          fetch(ASSET_ROOT + "data/ximen-name-badge-assets.json", { cache: "no-cache" }),
        ])
          .then(function (responses) {
            if (!responses[0].ok) {
              throw new Error("client-drink-catalog.json HTTP " + responses[0].status);
            }
            if (!responses[1].ok) throw new Error("menu.json HTTP " + responses[1].status);
            if (!responses[2].ok) {
              throw new Error("ximen-animation-assets.json HTTP " + responses[2].status);
            }
            if (!responses[3].ok) {
              throw new Error("ximen-name-badge-assets.json HTTP " + responses[3].status);
            }
            return Promise.all([
              responses[0].json(),
              responses[1].json(),
              responses[2].json(),
              responses[3].json(),
            ]);
          })
          .then(function (payload) {
            var catalog = payload[0];
            var menu = payload[1];
            var shellAssets = payload[2];
            var badgeAssets = payload[3];
            var shellByRank = (shellAssets && shellAssets.ranks) || {};
            var iconColumns = (badgeAssets && badgeAssets.iconColumns) || [];
            var assignmentsByXimenRank =
              (badgeAssets && badgeAssets.assignmentsByXimenRank) || {};
            iconColumnDefaults = (badgeAssets && badgeAssets.iconColumnDefaults) || {};
            indexLeafCatalog(shellAssets.leafCatalog || []);
            savedLeafPicks = loadLeafStorage();
            var savedToggles = loadToggleStorage();
            var menuMap = menuByZh(menu);
            var shellMap = shellByNameZh(menu, REGION, shellByRank);
            var iconMap = iconAssignmentsByNameZh(menu, REGION, assignmentsByXimenRank);
            var items = dedupeCatalogItems(catalog.items);
            if (!items.length) {
              showError("客戶品項清單是空的。");
              return;
            }
            renderAppMount({
              items: items,
              iconColumns: iconColumns,
              menuMap: menuMap,
              shellMap: shellMap,
              iconMap: iconMap,
              initialSavedToggles: savedToggles,
              initialSavedLeaves: savedLeafPicks,
              errorMessage: null,
            });
          })
          .catch(function (err) {
            showError(
              "無法載入資料：" +
                (err && err.message ? err.message : String(err)) +
                "。請用 HTTP 開啟此頁（勿直接用 file://）。"
            );
          });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>

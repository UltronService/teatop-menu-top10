<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TEATOP 飲料素材對照 · v1.0</title>
  <meta name="teatop-product-version" content="1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.16/antd.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .teatop-site-header {
      background: #fff !important;
      border-bottom: 1px solid #f0f0f0;
      padding: 0 24px;
      display: flex;
      align-items: center;
      height: 64px;
      line-height: 64px;
    }

    .teatop-site-header .title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #0c2f54;
    }

    .teatop-content {
      padding: 24px;
      min-height: calc(100vh - 64px);
      background: #f5f5f5;
    }

    .name-zh {
      font-weight: 600;
    }

    .name-en {
      margin-top: 4px;
      font-family: Montserrat, "Noto Sans TC", sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.45);
      line-height: 1.35;
      white-space: pre-line;
    }

    .asset-thumb-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 96px;
      height: 96px;
      background: #fff;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      overflow: hidden;
    }

    .asset-thumb-wrap img {
      max-width: 88px;
      max-height: 88px;
      object-fit: contain;
    }

    .leaf-thumb-btn {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      min-height: 96px;
      padding: 8px;
    }

    .leaf-thumb-btn img {
      max-width: 72px;
      max-height: 56px;
      object-fit: contain;
    }

    .leaf-thumb-label {
      margin-top: 4px;
      font-size: 11px;
      color: rgba(0, 0, 0, 0.45);
      text-align: center;
      max-width: 100px;
      line-height: 1.2;
    }

    .icon-toggle-btn {
      min-width: 56px;
      min-height: 56px;
      padding: 4px 8px;
      border-style: dashed !important;
    }

    .icon-toggle-btn.is-on {
      border-style: solid !important;
      border-color: #ec6f09 !important;
      background: #fff8f0 !important;
    }

    .badge-dot {
      display: inline-block;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid #d9d9d9;
    }

    .icon-glyph {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      min-height: 32px;
      font-size: 18px;
      font-weight: 700;
      color: #0c2f54;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      background: #fff;
    }

    .icon-glyph.gu {
      font-size: 16px;
    }

    .badge-img {
      max-width: 72px;
      max-height: 32px;
      object-fit: contain;
    }

    .leaf-modal-none-btn {
      width: 100%;
      margin-bottom: 16px;
      text-align: left;
      height: auto;
      padding: 12px 16px;
    }

    .leaf-option-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
      gap: 8px;
    }

    .leaf-option-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      height: auto;
    }

    .leaf-option-card img {
      width: 72px;
      height: 56px;
      object-fit: contain;
    }

    .leaf-option-card.is-selected {
      border-color: #ec6f09 !important;
      background: #fff8f0 !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.13/dayjs.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.16/antd.min.js" crossorigin="anonymous"></script>
  <script>
    (function () {
      "use strict";

      var REGION = "ximen";
      var ASSET_ROOT = "./";
      var TOGGLE_STORAGE_KEY = "teatop-drink-icon-toggles-v1";
      var LEAF_STORAGE_KEY = "teatop-drink-leaf-picks-v1";

      var iconColumnDefaults = Object.create(null);
      var leafCatalogList = [];
      var leafById = Object.create(null);
      var leafPickerContext = null;
      var savedLeafPicks = Object.create(null);

      var React = window.React;
      var useState = React.useState;
      var useEffect = React.useEffect;
      var useCallback = React.useCallback;
      var useMemo = React.useMemo;
      var createElement = React.createElement;
      var Fragment = React.Fragment;

      var Layout = antd.Layout;
      var Header = Layout.Header;
      var Content = Layout.Content;
      var Table = antd.Table;
      var Button = antd.Button;
      var Modal = antd.Modal;
      var Empty = antd.Empty;
      var Alert = antd.Alert;
      var ConfigProvider = antd.ConfigProvider;
      var zhTW = antd.locale && antd.locale.zh_TW;

      function resolveImage(rel) {
        if (!rel) return "";
        if (/^https?:\/\//i.test(rel)) return rel;
        return ASSET_ROOT + rel.replace(/^\.\//, "");
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function menuByZh(menu) {
        var map = Object.create(null);
        (menu.items || []).forEach(function (item) {
          if (!item.nameZh || map[item.nameZh]) return;
          map[item.nameZh] = item;
        });
        return map;
      }

      function shellByNameZh(menu, regionId, shellByRank) {
        var map = Object.create(null);
        (menu.items || []).forEach(function (item) {
          var r = item.regions && item.regions[regionId];
          if (!r || r.rank == null || r.rank > 5) return;
          var shell = shellByRank[String(r.rank)];
          if (shell && item.nameZh) map[item.nameZh] = shell;
        });
        return map;
      }

      function iconAssignmentsByNameZh(menu, regionId, assignmentsByXimenRank) {
        var map = Object.create(null);
        (menu.items || []).forEach(function (item) {
          var r = item.regions && item.regions[regionId];
          if (!r || r.rank == null || !item.nameZh) return;
          var rankKey = String(r.rank);
          if (!Object.prototype.hasOwnProperty.call(assignmentsByXimenRank, rankKey)) return;
          map[item.nameZh] = assignmentsByXimenRank[rankKey] || {};
        });
        return map;
      }

      function dedupeCatalogItems(items) {
        var seen = Object.create(null);
        var out = [];
        (items || []).forEach(function (entry) {
          var zh = (entry && entry.nameZh) || "";
          if (!zh || seen[zh]) return;
          seen[zh] = true;
          out.push({
            nameZh: zh,
            nameEn: (entry && entry.nameEn) || "",
          });
        });
        return out;
      }

      function loadLeafStorage() {
        try {
          var raw = localStorage.getItem(LEAF_STORAGE_KEY);
          if (!raw) return Object.create(null);
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return Object.create(null);
          return parsed;
        } catch (e) {
          return Object.create(null);
        }
      }

      function saveLeafStorage(state) {
        try {
          localStorage.setItem(LEAF_STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          /* ignore */
        }
      }

      function leafStorageKey(nameZh, slot) {
        return nameZh + "|" + slot;
      }

      function indexLeafCatalog(catalog) {
        leafCatalogList = catalog || [];
        leafById = Object.create(null);
        leafCatalogList.forEach(function (item) {
          if (item && item.id) leafById[item.id] = item;
        });
      }

      function leafIdForUrl(url) {
        if (!url) return "none";
        for (var i = 0; i < leafCatalogList.length; i++) {
          if (leafCatalogList[i].url === url) return leafCatalogList[i].id;
        }
        return "none";
      }

      function initialLeafId(nameZh, slot, shell, saved) {
        var key = leafStorageKey(nameZh, slot);
        if (Object.prototype.hasOwnProperty.call(saved, key)) {
          var v = saved[key];
          if (v === "none" || leafById[v]) return v;
        }
        if (!shell) return "none";
        var url = slot === "leftLeaf" ? shell.leftLeaf : shell.rightLeaf;
        return leafIdForUrl(url);
      }

      function loadToggleStorage() {
        try {
          var raw = localStorage.getItem(TOGGLE_STORAGE_KEY);
          if (!raw) return Object.create(null);
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return Object.create(null);
          return parsed;
        } catch (e) {
          return Object.create(null);
        }
      }

      function saveToggleStorage(state) {
        try {
          localStorage.setItem(TOGGLE_STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          /* ignore quota / private mode */
        }
      }

      function toggleStorageKey(nameZh, columnId) {
        return nameZh + "|" + columnId;
      }

      function iconDefForColumn(columnId, rowIcons) {
        if (rowIcons && rowIcons[columnId]) return rowIcons[columnId];
        return iconColumnDefaults[columnId] || null;
      }

      function initialToggleOn(nameZh, columnId, rowIcons, saved) {
        var key = toggleStorageKey(nameZh, columnId);
        if (Object.prototype.hasOwnProperty.call(saved, key)) {
          return saved[key] === true;
        }
        return !!(rowIcons && rowIcons[columnId]);
      }

      function closeLeafPickerModal(setModalState) {
        leafPickerContext = null;
        if (setModalState) {
          setModalState({ open: false, nameZh: "", slot: "", slotLabel: "", currentId: "none" });
        }
      }

      function applyLeafSelection(nameZh, slot, leafId, bump) {
        savedLeafPicks[leafStorageKey(nameZh, slot)] = leafId;
        saveLeafStorage(savedLeafPicks);
        if (bump) bump();
      }

      function openLeafPickerModal(nameZh, slot, slotLabel, savedLeaves, shellMap, setModalState) {
        var shell = shellMap[nameZh] || null;
        var currentId = initialLeafId(nameZh, slot, shell, savedLeaves);
        leafPickerContext = { nameZh: nameZh, slot: slot };
        setModalState({
          open: true,
          nameZh: nameZh,
          slot: slot,
          slotLabel: slotLabel,
          currentId: currentId,
        });
      }

      function buildToggleInner(iconDef, isOn, nameZh) {
        if (!isOn) {
          return createElement("span", { style: { color: "rgba(0,0,0,0.45)" } }, "—");
        }
        if (!iconDef) {
          return createElement("span", { style: { color: "rgba(0,0,0,0.45)" } }, "—");
        }
        if (iconDef.type === "colorDot") {
          return createElement("span", {
            className: "badge-dot",
            role: "img",
            "aria-label": "●冰飲",
            title: iconDef.title || "●冰飲",
            style: { backgroundColor: iconDef.color || "rgb(138, 184, 186)" },
          });
        }
        if (iconDef.type === "glyph" && iconDef.glyph) {
          var glyphClass = "icon-glyph";
          if (iconDef.glyph === "固" || iconDef.glyph === "古") glyphClass += " gu";
          return createElement(
            "span",
            { className: glyphClass, title: iconDef.title || iconDef.glyph },
            iconDef.glyph
          );
        }
        if (iconDef.type === "image" && iconDef.url) {
          return createElement("img", {
            className: "badge-img",
            src: iconDef.url,
            alt: nameZh || "",
            loading: "lazy",
            title: iconDef.title || "",
          });
        }
        return createElement("span", { style: { color: "rgba(0,0,0,0.45)" } }, "—");
      }

      function handleIconToggleClick(nameZh, columnId, rowIcons, savedToggles, bump) {
        var isOn = initialToggleOn(nameZh, columnId, rowIcons, savedToggles);
        var next = !isOn;
        if (nameZh && columnId) {
          savedToggles[toggleStorageKey(nameZh, columnId)] = next;
          saveToggleStorage(savedToggles);
        }
        bump();
      }

      function cupSrcForEntry(entry, menuMap, shellMap) {
        var menuItem = menuMap[entry.nameZh] || null;
        var shell = shellMap[entry.nameZh] || null;
        var menuImage = menuItem && menuItem.image ? menuItem.image : "";
        var cupSrc = menuImage ? resolveImage(menuImage) : "";
        if (!cupSrc && shell && shell.cupShell) cupSrc = shell.cupShell;
        return cupSrc;
      }

      function TeatopDrinkAssetApp(props) {
        var boot = props.boot;
        var items = boot.items;
        var menuMap = boot.menuMap;
        var shellMap = boot.shellMap;
        var iconMap = boot.iconMap;
        var iconColumns = boot.iconColumns;
        var savedToggles = boot.savedToggles;

        var tickState = useState(0);
        var bump = useCallback(function () {
          tickState[1](function (n) {
            return n + 1;
          });
        }, []);
        var tick = tickState[0];

        var modalStateHook = useState({
          open: false,
          nameZh: "",
          slot: "",
          slotLabel: "",
          currentId: "none",
        });
        var modalState = modalStateHook[0];
        var setModalState = modalStateHook[1];

        var tableData = useMemo(
          function () {
            return items.map(function (entry, index) {
              return {
                key: entry.nameZh || String(index),
                nameZh: entry.nameZh,
                nameEn: entry.nameEn || (menuMap[entry.nameZh] && menuMap[entry.nameZh].nameEn) || "",
                cupSrc: cupSrcForEntry(entry, menuMap, shellMap),
                shell: shellMap[entry.nameZh] || null,
                rowIcons: iconMap[entry.nameZh],
              };
            });
          },
          [items, menuMap, shellMap, iconMap]
        );

        var columns = useMemo(
          function () {
            var cols = [
              {
                title: "飲料",
                dataIndex: "nameZh",
                key: "drink",
                fixed: "left",
                width: 200,
                render: function (_, record) {
                  return createElement(
                    Fragment,
                    null,
                    createElement("div", { className: "name-zh" }, record.nameZh),
                    createElement("div", { className: "name-en" }, record.nameEn)
                  );
                },
              },
            ];

            (iconColumns || []).forEach(function (col) {
              cols.push({
                title: col.label || col.id,
                key: "icon-" + col.id,
                align: "center",
                width: 72,
                render: function (_, record) {
                  var columnId = col.id;
                  var columnLabel = col.label || col.id;
                  var rowIcons = record.rowIcons;
                  var iconDef = iconDefForColumn(columnId, rowIcons);
                  var isOn = initialToggleOn(record.nameZh, columnId, rowIcons, savedToggles);
                  var iconDefJson = iconDef ? JSON.stringify(iconDef) : "";
                  return createElement(
                    Button,
                    {
                      type: isOn ? "primary" : "default",
                      ghost: isOn,
                      className: "icon-toggle-btn" + (isOn ? " is-on" : ""),
                      "aria-pressed": isOn ? "true" : "false",
                      "data-drink-zh": record.nameZh,
                      "data-column-id": columnId,
                      "data-icon-def": iconDefJson,
                      title: (isOn ? "關閉" : "開啟") + "：" + columnLabel,
                      onClick: function () {
                        handleIconToggleClick(
                          record.nameZh,
                          columnId,
                          rowIcons,
                          savedToggles,
                          bump
                        );
                      },
                    },
                    buildToggleInner(iconDef, isOn, record.nameZh)
                  );
                },
              });
            });

            cols.push(
              {
                title: "杯圖",
                key: "cup",
                align: "center",
                width: 120,
                render: function (_, record) {
                  if (!record.cupSrc) {
                    return createElement(Empty, {
                      image: Empty.PRESENTED_IMAGE_SIMPLE,
                      description: "—",
                      style: { margin: 0 },
                    });
                  }
                  return createElement(
                    "a",
                    {
                      href: record.cupSrc,
                      target: "_blank",
                      rel: "noopener noreferrer",
                      title: "開啟原圖",
                    },
                    createElement(
                      "span",
                      { className: "asset-thumb-wrap" },
                      createElement("img", {
                        src: record.cupSrc,
                        alt: record.nameZh + " 杯圖",
                        loading: "lazy",
                      })
                    )
                  );
                },
              },
              {
                title: "左裝飾葉",
                key: "leftLeaf",
                align: "center",
                width: 130,
                render: function (_, record) {
                  return createElement(LeafPickerCell, {
                    nameZh: record.nameZh,
                    slot: "leftLeaf",
                    slotLabel: "左裝飾葉",
                    shell: record.shell,
                    savedLeaves: savedLeafPicks,
                    shellMap: shellMap,
                    setModalState: setModalState,
                    tick: tick,
                  });
                },
              },
              {
                title: "右裝飾葉",
                key: "rightLeaf",
                align: "center",
                width: 130,
                render: function (_, record) {
                  return createElement(LeafPickerCell, {
                    nameZh: record.nameZh,
                    slot: "rightLeaf",
                    slotLabel: "右裝飾葉",
                    shell: record.shell,
                    savedLeaves: savedLeafPicks,
                    shellMap: shellMap,
                    setModalState: setModalState,
                    tick: tick,
                  });
                },
              }
            );

            return cols;
          },
          [iconColumns, savedToggles, shellMap, tick, bump]
        );

        return createElement(
          Layout,
          { style: { minHeight: "100vh" } },
          createElement(
            Header,
            { className: "teatop-site-header" },
            createElement("h1", { className: "title" }, "TEATOP 飲料素材對照 · v1.0")
          ),
          createElement(
            Content,
            { className: "teatop-content" },
            createElement(Table, {
              columns: columns,
              dataSource: tableData,
              pagination: false,
              size: "middle",
              bordered: true,
              scroll: { x: 960 },
              locale: { emptyText: createElement(Empty, { description: "尚無品項" }) },
            })
          ),
          createElement(LeafPickerModal, {
            modalState: modalState,
            setModalState: setModalState,
            bump: bump,
          })
        );
      }

      function LeafPickerCell(props) {
        var leafId = initialLeafId(props.nameZh, props.slot, props.shell, props.savedLeaves);
        var leaf = leafId && leafId !== "none" ? leafById[leafId] : null;

        if (!leafId || leafId === "none" || !leaf) {
          return createElement(
            Button,
            {
              type: "link",
              className: "leaf-thumb-btn",
              title: "點擊選擇裝飾葉",
              onClick: function () {
                openLeafPickerModal(
                  props.nameZh,
                  props.slot,
                  props.slotLabel,
                  props.savedLeaves,
                  props.shellMap,
                  props.setModalState
                );
              },
            },
            createElement(Empty, {
              image: Empty.PRESENTED_IMAGE_SIMPLE,
              description: "沒有裝飾葉素材",
              style: { margin: 0, transform: "scale(0.85)" },
            })
          );
        }

        return createElement(
          Button,
          {
            type: "primary",
            ghost: true,
            className: "leaf-thumb-btn",
            title: "目前：" + leaf.label + "（點擊更換）",
            onClick: function () {
              openLeafPickerModal(
                props.nameZh,
                props.slot,
                props.slotLabel,
                props.savedLeaves,
                props.shellMap,
                props.setModalState
              );
            },
          },
          createElement("img", { src: leaf.url, alt: leaf.label, loading: "lazy" }),
          createElement("span", { className: "leaf-thumb-label" }, leaf.label)
        );
      }

      function LeafPickerModal(props) {
        var modalState = props.modalState;
        var setModalState = props.setModalState;
        var bump = props.bump;

        function onCancel() {
          closeLeafPickerModal(setModalState);
        }

        function pickLeaf(leafId) {
          if (!leafPickerContext) return;
          applyLeafSelection(
            leafPickerContext.nameZh,
            leafPickerContext.slot,
            leafId,
            bump
          );
          closeLeafPickerModal(setModalState);
        }

        var catalogEmpty = !leafCatalogList.length;

        return createElement(
          Modal,
          {
            visible: modalState.open,
            title: modalState.open ? modalState.nameZh + " · " + modalState.slotLabel + "（共 " + leafCatalogList.length + " 種可選）" : "選擇裝飾葉",
            onCancel: onCancel,
            footer: null,
            width: 640,
            destroyOnClose: true,
          },
          createElement(
            Button,
            {
              type: "default",
              className: "leaf-modal-none-btn",
              onClick: function () {
                pickLeaf("none");
              },
            },
            "沒有裝飾葉素材"
          ),
          catalogEmpty
            ? createElement(Empty, { description: "沒有裝飾葉素材" })
            : createElement(
                "div",
                { className: "leaf-option-grid" },
                leafCatalogList.map(function (leaf) {
                  var selected = leaf.id === modalState.currentId;
                  return createElement(
                    Button,
                    {
                      key: leaf.id,
                      type: selected ? "primary" : "default",
                      ghost: selected,
                      className: "leaf-option-card" + (selected ? " is-selected" : ""),
                      onClick: function () {
                        pickLeaf(leaf.id);
                      },
                    },
                    createElement("img", { src: leaf.url, alt: "", loading: "lazy" }),
                    createElement("span", null, leaf.label)
                  );
                })
              )
        );
      }

      function RootApp() {
        var stateHook = useState({ status: "loading", error: "", boot: null });
        var state = stateHook[0];
        var setState = stateHook[1];

        useEffect(function () {
          Promise.all([
            fetch(ASSET_ROOT + "data/client-drink-catalog.json", { cache: "no-cache" }),
            fetch(ASSET_ROOT + "data/menu.json", { cache: "no-cache" }),
            fetch(ASSET_ROOT + "data/ximen-animation-assets.json", { cache: "no-cache" }),
            fetch(ASSET_ROOT + "data/ximen-name-badge-assets.json", { cache: "no-cache" }),
          ])
            .then(function (responses) {
              if (!responses[0].ok) {
                throw new Error("client-drink-catalog.json HTTP " + responses[0].status);
              }
              if (!responses[1].ok) throw new Error("menu.json HTTP " + responses[1].status);
              if (!responses[2].ok) {
                throw new Error("ximen-animation-assets.json HTTP " + responses[2].status);
              }
              if (!responses[3].ok) {
                throw new Error("ximen-name-badge-assets.json HTTP " + responses[3].status);
              }
              return Promise.all([
                responses[0].json(),
                responses[1].json(),
                responses[2].json(),
                responses[3].json(),
              ]);
            })
            .then(function (payload) {
              var catalog = payload[0];
              var menu = payload[1];
              var shellAssets = payload[2];
              var badgeAssets = payload[3];
              var shellByRank = (shellAssets && shellAssets.ranks) || {};
              var iconColumns = (badgeAssets && badgeAssets.iconColumns) || [];
              var assignmentsByXimenRank =
                (badgeAssets && badgeAssets.assignmentsByXimenRank) || {};
              iconColumnDefaults = (badgeAssets && badgeAssets.iconColumnDefaults) || {};
              indexLeafCatalog(shellAssets.leafCatalog || []);
              savedLeafPicks = loadLeafStorage();
              var savedToggles = loadToggleStorage();
              var menuMap = menuByZh(menu);
              var shellMap = shellByNameZh(menu, REGION, shellByRank);
              var iconMap = iconAssignmentsByNameZh(menu, REGION, assignmentsByXimenRank);
              var items = dedupeCatalogItems(catalog.items);
              if (!items.length) {
                setState({
                  status: "error",
                  error: "客戶品項清單是空的。",
                  boot: null,
                });
                return;
              }
              setState({
                status: "ready",
                error: "",
                boot: {
                  items: items,
                  menuMap: menuMap,
                  shellMap: shellMap,
                  iconMap: iconMap,
                  iconColumns: iconColumns,
                  savedToggles: savedToggles,
                },
              });
            })
            .catch(function (err) {
              setState({
                status: "error",
                error:
                  "無法載入資料：" +
                  (err && err.message ? err.message : String(err)) +
                  "。請用 HTTP 開啟此頁（勿直接用 file://）。",
                boot: null,
              });
            });
        }, []);

        if (state.status === "loading") {
          return createElement(
            Layout,
            { style: { minHeight: "100vh" } },
            createElement(
              Header,
              { className: "teatop-site-header" },
              createElement("h1", { className: "title" }, "TEATOP 飲料素材對照 · v1.0")
            ),
            createElement(
              Content,
              { className: "teatop-content" },
              createElement(Empty, { description: "載入中…" })
            )
          );
        }

        if (state.status === "error") {
          return createElement(
            Layout,
            { style: { minHeight: "100vh" } },
            createElement(
              Header,
              { className: "teatop-site-header" },
              createElement("h1", { className: "title" }, "TEATOP 飲料素材對照 · v1.0")
            ),
            createElement(
              Content,
              { className: "teatop-content" },
              createElement(Alert, { type: "error", message: state.error, showIcon: true })
            )
          );
        }

        return createElement(TeatopDrinkAssetApp, { boot: state.boot });
      }

      function mount() {
        var rootEl = document.getElementById("root");
        if (!rootEl) return;
        var localeProps = zhTW ? { locale: zhTW } : {};
        var tree = createElement(
          ConfigProvider,
          localeProps,
          createElement(RootApp, null)
        );
        if (ReactDOM.createRoot) {
          ReactDOM.createRoot(rootEl).render(tree);
        } else {
          ReactDOM.render(tree, rootEl);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", mount);
      } else {
        mount();
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TEATOP 區域排行與價格 · 示意 · v1.0</title>
  <meta name="teatop-product-version" content="1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0c2f54;
      --orange: #ec6f09;
      --border: #ddd5cb;
      --muted: #5c534a;
      --bg: #f7f4f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: #1a1510;
      line-height: 1.45;
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.25rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.15rem;
      color: var(--navy);
    }

    header p {
      margin: 0.35rem 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    header .badge {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      background: #fff3e6;
      color: var(--orange);
      font-size: 0.75rem;
      font-weight: 600;
    }

    main {
      padding: 1rem;
      max-width: 1280px;
      margin: 0 auto;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .tabs button {
      border: 1px solid var(--border);
      background: #fff;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .tabs button[aria-selected="true"] {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }

    .panel[hidden] {
      display: none;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .toolbar label {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .toolbar select {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      min-width: 10rem;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      min-width: 520px;
    }

    thead th {
      background: var(--navy);
      color: #fff;
      text-align: left;
      padding: 0.6rem 0.5rem;
      border: 1px solid #0a2847;
      white-space: nowrap;
    }

    thead th.region-col {
      text-align: center;
      font-size: 0.78rem;
      line-height: 1.25;
    }

    tbody td {
      border: 1px solid var(--border);
      padding: 0.5rem;
      vertical-align: middle;
    }

    tbody tr:nth-child(even) {
      background: #faf8f5;
    }

    .col-drink .name-zh {
      font-weight: 600;
    }

    .col-drink .name-en {
      font-size: 0.75rem;
      color: var(--muted);
      font-family: Montserrat, "Noto Sans TC", sans-serif;
      margin-top: 0.2rem;
    }

    .cell-muted {
      text-align: center;
      color: var(--muted);
    }

    .cell-region {
      text-align: center;
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .cell-region .rank {
      font-weight: 700;
      color: var(--navy);
    }

    .cell-region .price {
      color: var(--muted);
    }

    .cell-region.is-diff {
      background: #fff8f0;
    }

    .error-banner {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    footer {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    footer a {
      color: #d45f00;
    }
  </style>
</head>
<body>
  <header>
    <h1>TEATOP 區域排行與價格</h1>
    <p>唯讀示意 · 資料來源 <code>data/menu.json</code>（與各區播放器相同）</p>
    <span class="badge">示意版 · v1.0</span>
  </header>
  <main>
    <div id="error" class="error-banner" hidden></div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-region" aria-selected="true" aria-controls="panel-region">依區域 TOP10</button>
      <button type="button" role="tab" id="tab-matrix" aria-selected="false" aria-controls="panel-matrix">跨區對照（20 品項）</button>
    </div>

    <section id="panel-region" class="panel" role="tabpanel" aria-labelledby="tab-region">
      <div class="toolbar">
        <label for="region-select">選擇區域</label>
        <select id="region-select" aria-label="選擇區域"></select>
      </div>
      <div class="table-wrap">
        <table aria-label="區域 TOP10 排行與價格">
          <thead>
            <tr>
              <th scope="col">排名</th>
              <th scope="col">飲料</th>
              <th scope="col">大杯價</th>
            </tr>
          </thead>
          <tbody id="region-table-body"></tbody>
        </table>
      </div>
    </section>

    <section id="panel-matrix" class="panel" role="tabpanel" aria-labelledby="tab-matrix" hidden>
      <p style="margin:0 0 0.75rem;font-size:0.85rem;color:var(--muted)">
        列：客戶清單 20 品 · 欄：七區 · 儲存格格式「#排名 / $價格」，未進該區 TOP10 顯示 —
      </p>
      <div class="table-wrap">
        <table aria-label="跨區排行與價格對照">
          <thead id="matrix-thead"></thead>
          <tbody id="matrix-tbody"></tbody>
        </table>
      </div>
    </section>

    <footer>
      <a href="index.html">← 返回首頁</a>
      ·
      <a href="drink-asset-review.html">素材對照表</a>
    </footer>
  </main>
  <script>
    (function () {
      "use strict";

      var ASSET_ROOT = "./";

      var LABELS = {
        central: "中部",
        "central-smart": "中部智慧店",
        "mrt-tamsui": "捷運淡水",
        north: "北部",
        "north-smart": "北部智慧店",
        south: "南部",
        ximen: "西門",
      };

      var menuData = null;
      var catalogItems = [];

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function showError(msg) {
        var el = document.getElementById("error");
        if (!el) return;
        el.hidden = false;
        el.textContent = msg;
      }

      function menuByZh(menu) {
        var map = Object.create(null);
        (menu.items || []).forEach(function (item) {
          if (item.nameZh && !map[item.nameZh]) map[item.nameZh] = item;
        });
        return map;
      }

      function itemsForRegion(menu, regionId) {
        var list = [];
        (menu.items || []).forEach(function (item) {
          var r = item.regions && item.regions[regionId];
          if (!r || r.rank == null) return;
          list.push({
            nameZh: item.nameZh || "",
            nameEn: item.nameEn || "",
            rank: Number(r.rank),
            priceL: r.priceL,
          });
        });
        list.sort(function (a, b) {
          return a.rank - b.rank;
        });
        return list;
      }

      function dedupeCatalog(items) {
        var seen = Object.create(null);
        var out = [];
        (items || []).forEach(function (entry) {
          var zh = (entry && entry.nameZh) || "";
          if (!zh || seen[zh]) return;
          seen[zh] = true;
          out.push({
            nameZh: zh,
            nameEn: (entry && entry.nameEn) || "",
          });
        });
        return out;
      }

      function formatPrice(priceL) {
        if (priceL == null || priceL === "") return "—";
        return "$" + priceL + " L";
      }

      function renderRegionTable(regionId) {
        var tbody = document.getElementById("region-table-body");
        if (!tbody || !menuData) return;
        var rows = itemsForRegion(menuData, regionId);
        tbody.innerHTML = "";
        if (!rows.length) {
          tbody.innerHTML =
            '<tr><td colspan="3" class="cell-muted">此區域尚無 TOP10 資料</td></tr>';
          return;
        }
        rows.forEach(function (row) {
          var tr = document.createElement("tr");
          tr.innerHTML =
            '<td class="cell-muted">' +
            escapeHtml(row.rank) +
            '</td><td class="col-drink"><div class="name-zh">' +
            escapeHtml(row.nameZh) +
            '</div><div class="name-en">' +
            escapeHtml(row.nameEn) +
            "</div></td><td>" +
            escapeHtml(formatPrice(row.priceL)) +
            "</td>";
          tbody.appendChild(tr);
        });
      }

      function regionCellHtml(menuItem, regionId) {
        if (!menuItem || !menuItem.regions) {
          return '<td class="cell-region cell-muted">—</td>';
        }
        var r = menuItem.regions[regionId];
        if (!r || r.rank == null) {
          return '<td class="cell-region cell-muted">—</td>';
        }
        return (
          '<td class="cell-region"><div class="rank">#' +
          escapeHtml(r.rank) +
          '</div><div class="price">' +
          escapeHtml(formatPrice(r.priceL)) +
          "</div></td>"
        );
      }

      function renderMatrixTable() {
        var thead = document.getElementById("matrix-thead");
        var tbody = document.getElementById("matrix-tbody");
        if (!thead || !tbody || !menuData) return;
        var regions = menuData.regions || [];
        var map = menuByZh(menuData);

        var headRow = document.createElement("tr");
        headRow.innerHTML = '<th scope="col">飲料</th>';
        regions.forEach(function (rid) {
          var th = document.createElement("th");
          th.scope = "col";
          th.className = "region-col";
          th.textContent = LABELS[rid] || rid;
          headRow.appendChild(th);
        });
        thead.innerHTML = "";
        thead.appendChild(headRow);

        tbody.innerHTML = "";
        catalogItems.forEach(function (entry) {
          var menuItem = map[entry.nameZh] || null;
          var tr = document.createElement("tr");
          var drinkTd =
            '<td class="col-drink"><div class="name-zh">' +
            escapeHtml(entry.nameZh) +
            '</div><div class="name-en">' +
            escapeHtml(entry.nameEn || (menuItem && menuItem.nameEn) || "") +
            "</div></td>";
          tr.innerHTML = drinkTd;
          regions.forEach(function (rid) {
            var tmp = document.createElement("template");
            tmp.innerHTML = regionCellHtml(menuItem, rid);
            tr.appendChild(tmp.content.firstChild);
          });
          tbody.appendChild(tr);
        });
      }

      function fillRegionSelect(regions) {
        var sel = document.getElementById("region-select");
        if (!sel) return;
        sel.innerHTML = "";
        regions.forEach(function (rid) {
          var opt = document.createElement("option");
          opt.value = rid;
          opt.textContent = (LABELS[rid] || rid) + "（" + rid + "）";
          sel.appendChild(opt);
        });
        sel.addEventListener("change", function () {
          renderRegionTable(sel.value);
        });
        if (regions.length) renderRegionTable(regions[0]);
      }

      function wireTabs() {
        var tabRegion = document.getElementById("tab-region");
        var tabMatrix = document.getElementById("tab-matrix");
        var panelRegion = document.getElementById("panel-region");
        var panelMatrix = document.getElementById("panel-matrix");
        if (!tabRegion || !tabMatrix) return;

        tabRegion.addEventListener("click", function () {
          tabRegion.setAttribute("aria-selected", "true");
          tabMatrix.setAttribute("aria-selected", "false");
          panelRegion.hidden = false;
          panelMatrix.hidden = true;
        });
        tabMatrix.addEventListener("click", function () {
          tabMatrix.setAttribute("aria-selected", "true");
          tabRegion.setAttribute("aria-selected", "false");
          panelMatrix.hidden = false;
          panelRegion.hidden = true;
        });
      }

      function boot() {
        wireTabs();
        Promise.all([
          fetch(ASSET_ROOT + "data/menu.json", { cache: "no-cache" }),
          fetch(ASSET_ROOT + "data/client-drink-catalog.json", { cache: "no-cache" }),
        ])
          .then(function (responses) {
            if (!responses[0].ok) throw new Error("menu.json HTTP " + responses[0].status);
            if (!responses[1].ok) {
              throw new Error("client-drink-catalog.json HTTP " + responses[1].status);
            }
            return Promise.all([responses[0].json(), responses[1].json()]);
          })
          .then(function (payload) {
            menuData = payload[0];
            catalogItems = dedupeCatalog(payload[1].items);
            fillRegionSelect(menuData.regions || []);
            renderMatrixTable();
          })
          .catch(function (err) {
            showError(
              "無法載入資料：" +
                (err && err.message ? err.message : String(err)) +
                "。請以 HTTP 開啟（GitHub Pages 或本機 python -m http.server）。"
            );
          });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>

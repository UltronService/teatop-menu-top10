<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TEATOP 區域排行與價格 · 跨區對照 · v1.0</title>
  <meta name="teatop-product-version" content="1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/antd/5.24.9/reset.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      margin: 0;
      background: #f5f5f5;
    }

    .teatop-page-header-title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.88);
      line-height: 64px;
    }

    .teatop-drink-name-zh {
      font-weight: 600;
      color: rgba(0, 0, 0, 0.88);
    }

    .teatop-drink-name-en {
      margin-top: 4px;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.45);
      line-height: 1.35;
      font-family: Montserrat, "Noto Sans TC", sans-serif;
    }

    .teatop-region-col-title.has-col-error {
      box-shadow: inset 0 -3px 0 #ff4d4f;
      padding-bottom: 4px;
    }

    .teatop-cell-edit {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 88px;
    }

    .teatop-cell-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: rgba(0, 0, 0, 0.45);
    }

    .teatop-cell-field .ant-input-number {
      width: 72px;
    }

    .teatop-cell-err {
      font-size: 11px;
      color: #ff4d4f;
      line-height: 1.2;
      min-height: 14px;
    }

    .teatop-input-modified.ant-input-number {
      border-color: #ec6f09;
    }

    .teatop-input-modified.ant-input-number-focused {
      box-shadow: 0 0 0 2px rgba(236, 111, 9, 0.15);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.13/dayjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/antd/5.24.9/antd.min.js"></script>

  <script>
    (function () {
      "use strict";

      var e = React.createElement;
      var useState = React.useState;
      var useMemo = React.useMemo;
      var useCallback = React.useCallback;

      var Layout = antd.Layout;
      var Header = Layout.Header;
      var Content = Layout.Content;
      var Footer = Layout.Footer;
      var Table = antd.Table;
      var Button = antd.Button;
      var InputNumber = antd.InputNumber;
      var Alert = antd.Alert;
      var Card = antd.Card;
      var Space = antd.Space;
      var Typography = antd.Typography;
      var ConfigProvider = antd.ConfigProvider;

      var ASSET_ROOT = "./";
      var STORAGE_KEY = "teatop-region-matrix-edits-v1";

      var LABELS = {
        central: "中部",
        "central-smart": "中部智慧店",
        "mrt-tamsui": "捷運淡水",
        north: "北部",
        "north-smart": "北部智慧店",
        south: "南部",
        ximen: "西門",
      };

      var menuData = null;
      var catalogItems = [];
      var menuByZhMap = Object.create(null);
      var overrides = Object.create(null);
      var regionIds = [];

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function storageKey(itemKey, regionId) {
        return itemKey + "|" + regionId;
      }

      function itemKeyForRow(entry) {
        var menuItem = menuByZhMap[entry.nameZh];
        if (menuItem && menuItem.id) return menuItem.id;
        return "zh:" + entry.nameZh;
      }

      function baseRegionData(menuItem, regionId) {
        if (!menuItem || !menuItem.regions) return { rank: null, priceL: null };
        var r = menuItem.regions[regionId];
        if (!r || r.rank == null) return { rank: null, priceL: null };
        return { rank: Number(r.rank), priceL: r.priceL != null ? Number(r.priceL) : null };
      }

      function loadOverrides() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return Object.create(null);
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return Object.create(null);
          return parsed;
        } catch (err) {
          return Object.create(null);
        }
      }

      function saveOverrides() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(overrides));
        } catch (err) {
          /* ignore */
        }
      }

      function effectiveData(itemKey, regionId, menuItem) {
        var key = storageKey(itemKey, regionId);
        if (Object.prototype.hasOwnProperty.call(overrides, key)) {
          return {
            rank: overrides[key].rank,
            priceL: overrides[key].priceL,
          };
        }
        return baseRegionData(menuItem, regionId);
      }

      function isModified(itemKey, regionId, menuItem) {
        var key = storageKey(itemKey, regionId);
        if (!Object.prototype.hasOwnProperty.call(overrides, key)) return false;
        var base = baseRegionData(menuItem, regionId);
        var cur = overrides[key];
        return cur.rank !== base.rank || cur.priceL !== base.priceL;
      }

      function setOverride(itemKey, regionId, menuItem, rank, priceL) {
        var key = storageKey(itemKey, regionId);
        var base = baseRegionData(menuItem, regionId);
        if (rank === base.rank && priceL === base.priceL) {
          delete overrides[key];
        } else {
          overrides[key] = { rank: rank, priceL: priceL };
        }
        saveOverrides();
      }

      function parseRankInput(raw) {
        var s = String(raw == null ? "" : raw).trim();
        if (s === "") return { ok: true, value: null };
        var n = Number(s);
        if (!Number.isInteger(n) || n < 1 || n > 10) {
          return { ok: false, message: "排名須為 1–10 或空白" };
        }
        return { ok: true, value: n };
      }

      function parsePriceInput(raw, hasRank) {
        var s = String(raw == null ? "" : raw).trim();
        if (s === "") {
          if (hasRank) return { ok: false, message: "有排名時須填價格" };
          return { ok: true, value: null };
        }
        var n = Number(s);
        if (!Number.isFinite(n) || n < 0 || Math.floor(n) !== n) {
          return { ok: false, message: "價格須為 0 以上整數" };
        }
        return { ok: true, value: n };
      }

      function collectRegionValues(regionId) {
        var list = [];
        catalogItems.forEach(function (entry) {
          var itemKey = itemKeyForRow(entry);
          var menuItem = menuByZhMap[entry.nameZh] || null;
          var data = effectiveData(itemKey, regionId, menuItem);
          if (data.rank != null) {
            list.push({ itemKey: itemKey, rank: data.rank });
          }
        });
        return list;
      }

      function validateRegion(regionId) {
        var ranked = collectRegionValues(regionId);
        var errors = Object.create(null);
        var rankCount = Object.create(null);
        ranked.forEach(function (row) {
          var r = row.rank;
          if (!rankCount[r]) rankCount[r] = [];
          rankCount[r].push(row.itemKey);
        });
        Object.keys(rankCount).forEach(function (rank) {
          if (rankCount[rank].length > 1) {
            rankCount[rank].forEach(function (itemKey) {
              var k = itemKey + "|" + regionId;
              errors[k] = "排名 " + rank + " 重複";
            });
          }
        });
        if (ranked.length > 10) {
          catalogItems.forEach(function (entry) {
            var itemKey = itemKeyForRow(entry);
            var menuItem = menuByZhMap[entry.nameZh] || null;
            var data = effectiveData(itemKey, regionId, menuItem);
            if (data.rank != null) {
              errors[itemKey + "|" + regionId] = "該區最多 10 品";
            }
          });
        }
        return errors;
      }

      function validateAllRegions() {
        var merged = Object.create(null);
        regionIds.forEach(function (rid) {
          var regErr = validateRegion(rid);
          Object.keys(regErr).forEach(function (k) {
            merged[k] = regErr[k];
          });
        });
        return merged;
      }

      function regionHasColumnError(regionId, allErrors) {
        var has = false;
        catalogItems.forEach(function (entry) {
          var itemKey = itemKeyForRow(entry);
          if (allErrors[itemKey + "|" + regionId]) has = true;
        });
        return has;
      }

      function dedupeCatalog(items) {
        var seen = Object.create(null);
        var out = [];
        (items || []).forEach(function (entry) {
          var zh = (entry && entry.nameZh) || "";
          if (!zh || seen[zh]) return;
          seen[zh] = true;
          out.push({
            nameZh: zh,
            nameEn: (entry && entry.nameEn) || "",
          });
        });
        return out;
      }

      function buildMenuByZh(menu) {
        var map = Object.create(null);
        (menu.items || []).forEach(function (item) {
          if (item.nameZh && !map[item.nameZh]) map[item.nameZh] = item;
        });
        return map;
      }

      function RegionEditCell(props) {
        var entry = props.entry;
        var regionId = props.regionId;
        var allErrors = props.allErrors;
        var onCommitted = props.onCommitted;

        var itemKey = itemKeyForRow(entry);
        var menuItem = menuByZhMap[entry.nameZh] || null;
        var data = effectiveData(itemKey, regionId, menuItem);
        var errKey = itemKey + "|" + regionId;
        var regionErr = allErrors[errKey] || "";

        var rankState = useState(data.rank != null ? data.rank : null);
        var rankVal = rankState[0];
        var setRankVal = rankState[1];
        var priceState = useState(data.priceL != null ? data.priceL : null);
        var priceVal = priceState[0];
        var setPriceVal = priceState[1];
        var localErrState = useState("");
        var localErr = localErrState[0];
        var setLocalErr = localErrState[1];

        React.useEffect(
          function () {
            var fresh = effectiveData(itemKey, regionId, menuItem);
            setRankVal(fresh.rank != null ? fresh.rank : null);
            setPriceVal(fresh.priceL != null ? fresh.priceL : null);
          },
          [props.revision, itemKey, regionId]
        );

        var modified = isModified(itemKey, regionId, menuItem);
        var inputClass = modified ? "teatop-input-modified" : "";
        var displayErr = localErr || regionErr;

        function commit(rankRaw, priceRaw) {
          var rankParsed = parseRankInput(rankRaw);
          if (!rankParsed.ok) {
            setLocalErr(rankParsed.message);
            return;
          }
          var priceParsed = parsePriceInput(priceRaw, rankParsed.value != null);
          if (!priceParsed.ok) {
            setLocalErr(priceParsed.message);
            return;
          }
          if (rankParsed.value == null && priceParsed.value != null) {
            setLocalErr("無排名時不可填價格");
            return;
          }
          setOverride(itemKey, regionId, menuItem, rankParsed.value, priceParsed.value);
          setLocalErr("");
          onCommitted();
        }

        function commitFromState() {
          commit(rankVal == null ? "" : rankVal, priceVal == null ? "" : priceVal);
        }

        return e(
          "div",
          { className: "teatop-cell-edit" },
          e(
            "div",
            { className: "teatop-cell-field" },
            e("span", null, "排名"),
            e(InputNumber, {
              className: inputClass,
              min: 1,
              max: 10,
              step: 1,
              controls: false,
              size: "small",
              status: displayErr ? "error" : undefined,
              value: rankVal,
              placeholder: "—",
              "aria-label": "排名",
              onChange: function (val) {
                setRankVal(val);
              },
              onBlur: commitFromState,
              onPressEnter: commitFromState,
            })
          ),
          e(
            "div",
            { className: "teatop-cell-field" },
            e("span", null, "$L"),
            e(InputNumber, {
              className: inputClass,
              min: 0,
              step: 1,
              precision: 0,
              controls: false,
              size: "small",
              status: displayErr ? "error" : undefined,
              value: priceVal,
              placeholder: "—",
              "aria-label": "大杯價",
              onChange: function (val) {
                setPriceVal(val);
              },
              onBlur: commitFromState,
              onPressEnter: commitFromState,
            })
          ),
          e(
            "span",
            { className: "teatop-cell-err", role: "alert" },
            displayErr
          )
        );
      }

      function RegionRankPriceApp(props) {
        var revisionState = useState(0);
        var revision = revisionState[0];
        var bump = useCallback(function () {
          revisionState[1](function (n) {
            return n + 1;
          });
        }, []);

        var allErrors = useMemo(
          function () {
            return validateAllRegions();
          },
          [revision, props.ready]
        );

        var modCount = Object.keys(overrides).length;
        var errorKeys = Object.keys(allErrors);

        var handleReset = useCallback(function () {
          overrides = Object.create(null);
          saveOverrides();
          bump();
        }, [bump]);

        var tableData = useMemo(
          function () {
            return catalogItems.map(function (entry) {
              return {
                key: itemKeyForRow(entry),
                entry: entry,
              };
            });
          },
          [props.ready]
        );

        var columns = useMemo(
          function () {
            var cols = [
              {
                title: "飲料",
                key: "drink",
                fixed: "left",
                width: 160,
                render: function (_text, record) {
                  var menuItem = menuByZhMap[record.entry.nameZh] || null;
                  return e(
                    "div",
                    null,
                    e("div", { className: "teatop-drink-name-zh" }, record.entry.nameZh),
                    e(
                      "div",
                      { className: "teatop-drink-name-en" },
                      record.entry.nameEn || (menuItem && menuItem.nameEn) || ""
                    )
                  );
                },
              },
            ];

            regionIds.forEach(function (rid) {
              var colErr = regionHasColumnError(rid, allErrors);
              cols.push({
                title: e(
                  "span",
                  {
                    className: "teatop-region-col-title" + (colErr ? " has-col-error" : ""),
                  },
                  LABELS[rid] || rid
                ),
                key: "region-" + rid,
                align: "center",
                width: 110,
                render: function (_text, record) {
                  return e(RegionEditCell, {
                    entry: record.entry,
                    regionId: rid,
                    allErrors: allErrors,
                    revision: revision,
                    onCommitted: bump,
                  });
                },
              });
            });

            return cols;
          },
          [allErrors, revision, bump]
        );

        if (props.loadError) {
          return e(
            ConfigProvider,
            {
              theme: {
                token: { colorPrimary: "#ec6f09", borderRadius: 8 },
              },
            },
            e(
              Layout,
              { style: { minHeight: "100vh", background: "#f5f5f5" } },
              e(
                Header,
                {
                  style: {
                    background: "#fff",
                    padding: "0 24px",
                    height: 64,
                    lineHeight: "64px",
                    borderBottom: "1px solid #f0f0f0",
                  },
                },
                e("h1", { className: "teatop-page-header-title" }, "TEATOP 區域排行與價格 · 跨區對照")
              ),
              e(
                Content,
                { style: { padding: 24, maxWidth: 1400, margin: "0 auto", width: "100%" } },
                e(Alert, { type: "error", message: props.loadError, showIcon: true })
              )
            )
          );
        }

        return e(
          ConfigProvider,
          {
            theme: {
              token: { colorPrimary: "#ec6f09", borderRadius: 8 },
            },
          },
          e(
            Layout,
            { style: { minHeight: "100vh", background: "#f5f5f5" } },
            e(
              Header,
              {
                style: {
                  background: "#fff",
                  padding: "0 24px",
                  height: 64,
                  lineHeight: "64px",
                  borderBottom: "1px solid #f0f0f0",
                  position: "sticky",
                  top: 0,
                  zIndex: 10,
                },
              },
              e("h1", { className: "teatop-page-header-title" }, "TEATOP 區域排行與價格 · 跨區對照")
            ),
            e(
              Content,
              { style: { padding: 24, maxWidth: 1400, margin: "0 auto", width: "100%" } },
              e(
                Typography.Paragraph,
                { type: "secondary", style: { marginTop: 0 } },
                "可編輯排名（1–10）與大杯價；變更存於本機瀏覽器，不會直接改動 ",
                e("code", null, "menu.json"),
                "。"
              ),
              errorKeys.length
                ? e(Alert, {
                    type: "error",
                    showIcon: true,
                    style: { marginBottom: 16 },
                    message:
                      "檢查未通過（" +
                      errorKeys.length +
                      " 格）：同一區域排名不可重複、最多 10 品；有排名須填價格。",
                  })
                : null,
              !errorKeys.length
                ? e(Alert, {
                    type: "success",
                    showIcon: true,
                    style: { marginBottom: 16 },
                    message:
                      modCount > 0
                        ? "目前有效；已修改 " + modCount + " 格（仅存於本機）。"
                        : "目前有效；與 menu.json 預設一致。",
                  })
                : null,
              e(
                Card,
                { bordered: true, bodyStyle: { padding: 16 } },
                e(
                  Space,
                  {
                    style: {
                      width: "100%",
                      marginBottom: 16,
                      justifyContent: "space-between",
                      flexWrap: "wrap",
                    },
                  },
                  e(
                    Typography.Text,
                    { type: "secondary" },
                    "列：客戶 20 品 · 空白排名＝該區不列入 TOP10"
                  ),
                  e(
                    Button,
                    { type: "primary", onClick: handleReset },
                    "還原 menu.json 預設"
                  )
                ),
                e(Table, {
                  columns: columns,
                  dataSource: tableData,
                  pagination: false,
                  bordered: true,
                  size: "small",
                  scroll: { x: "max-content" },
                })
              ),
              e(
                Footer,
                {
                  style: {
                    textAlign: "left",
                    background: "transparent",
                    padding: "16px 0 0",
                  },
                },
                e(
                  Space,
                  { split: e(Typography.Text, { type: "secondary" }, "·") },
                  e(Typography.Link, { href: "index.html" }, "← 返回首頁"),
                  e(Typography.Link, { href: "drink-asset-review.html" }, "素材對照表")
                )
              )
            )
          )
        );
      }

      function RootApp() {
        var readyState = useState(false);
        var ready = readyState[0];
        var setReady = readyState[1];
        var loadErrorState = useState("");
        var loadError = loadErrorState[0];
        var setLoadError = loadErrorState[1];

        React.useEffect(function () {
          overrides = loadOverrides();
          Promise.all([
            fetch(ASSET_ROOT + "data/menu.json", { cache: "no-cache" }),
            fetch(ASSET_ROOT + "data/client-drink-catalog.json", { cache: "no-cache" }),
          ])
            .then(function (responses) {
              if (!responses[0].ok) throw new Error("menu.json HTTP " + responses[0].status);
              if (!responses[1].ok) {
                throw new Error("client-drink-catalog.json HTTP " + responses[1].status);
              }
              return Promise.all([responses[0].json(), responses[1].json()]);
            })
            .then(function (payload) {
              menuData = payload[0];
              regionIds = menuData.regions || [];
              catalogItems = dedupeCatalog(payload[1].items);
              menuByZhMap = buildMenuByZh(menuData);
              setReady(true);
            })
            .catch(function (err) {
              setLoadError(
                "無法載入資料：" +
                  (err && err.message ? err.message : String(err)) +
                  "。請以 HTTP 開啟。"
              );
            });
        }, []);

        return e(RegionRankPriceApp, { ready: ready, loadError: loadError });
      }

      function mount() {
        var rootEl = document.getElementById("root");
        if (!rootEl) return;
        ReactDOM.createRoot(rootEl).render(e(RootApp, null));
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", mount);
      } else {
        mount();
      }
    })();
  </script>
</body>
</html>

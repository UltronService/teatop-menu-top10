<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TEATOP 區域排行與價格 · 跨區對照 · v1.0</title>
  <meta name="teatop-product-version" content="1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0c2f54;
      --orange: #ec6f09;
      --border: #ddd5cb;
      --muted: #5c534a;
      --bg: #f7f4f0;
      --err: #b91c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: #1a1510;
      line-height: 1.45;
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.25rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.15rem;
      color: var(--navy);
    }

    header p {
      margin: 0.35rem 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    main {
      padding: 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .toolbar button {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
    }

    .toolbar button.primary {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .toolbar .hint {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      min-width: 960px;
    }

    thead th {
      background: var(--navy);
      color: #fff;
      text-align: left;
      padding: 0.55rem 0.4rem;
      border: 1px solid #0a2847;
    }

    thead th.region-col {
      text-align: center;
      font-size: 0.76rem;
      line-height: 1.25;
      min-width: 6.5rem;
    }

    tbody td {
      border: 1px solid var(--border);
      padding: 0.35rem;
      vertical-align: top;
    }

    tbody tr:nth-child(even) {
      background: #faf8f5;
    }

    .col-drink .name-zh {
      font-weight: 600;
    }

    .col-drink .name-en {
      font-size: 0.72rem;
      color: var(--muted);
      font-family: Montserrat, "Noto Sans TC", sans-serif;
      margin-top: 0.15rem;
    }

    .cell-edit {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .cell-edit label {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.68rem;
      color: var(--muted);
    }

    .cell-edit input {
      width: 3.1rem;
      padding: 0.2rem 0.25rem;
      font-family: inherit;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .cell-edit input.price-input {
      width: 3.6rem;
    }

    .cell-edit input.is-invalid {
      border-color: var(--err);
      background: #fef2f2;
    }

    .cell-edit input.is-modified {
      border-color: var(--orange);
    }

    .cell-edit .cell-err {
      font-size: 0.65rem;
      color: var(--err);
      line-height: 1.2;
      min-height: 0.8rem;
    }

    thead th.region-col.has-col-error {
      box-shadow: inset 0 -3px 0 var(--err);
    }

    .banner {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      font-size: 0.88rem;
    }

    .banner-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--err);
    }

    .banner-ok {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .banner[hidden] {
      display: none;
    }

    footer {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    footer a {
      color: #d45f00;
    }
  </style>
</head>
<body>
  <header>
    <h1>TEATOP 區域排行與價格 · 跨區對照</h1>
    <p>可編輯排名（1–10）與大杯價；變更存於本機瀏覽器，不會直接改動 <code>menu.json</code>。</p>
  </header>
  <main>
    <div id="load-error" class="banner banner-error" hidden></div>
    <div id="validate-banner" class="banner banner-error" hidden></div>
    <div id="status-banner" class="banner banner-ok" hidden></div>

    <section class="panel">
      <div class="toolbar">
        <span class="hint">列：客戶 20 品 · 空白排名＝該區不列入 TOP10</span>
        <button type="button" id="btn-reset" class="primary">還原 menu.json 預設</button>
      </div>
      <div class="table-wrap">
        <table aria-label="跨區排行與價格對照（可編輯）">
          <thead id="matrix-thead"></thead>
          <tbody id="matrix-tbody"></tbody>
        </table>
      </div>
    </section>

    <footer>
      <a href="index.html">← 返回首頁</a>
      ·
      <a href="drink-asset-review.html">素材對照表</a>
    </footer>
  </main>
  <script>
    (function () {
      "use strict";

      var ASSET_ROOT = "./";
      var STORAGE_KEY = "teatop-region-matrix-edits-v1";

      var LABELS = {
        central: "中部",
        "central-smart": "中部智慧店",
        "mrt-tamsui": "捷運淡水",
        north: "北部",
        "north-smart": "北部智慧店",
        south: "南部",
        ximen: "西門",
      };

      var menuData = null;
      var catalogItems = [];
      var menuByZhMap = Object.create(null);
      var overrides = Object.create(null);
      var regionIds = [];

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function storageKey(itemKey, regionId) {
        return itemKey + "|" + regionId;
      }

      function itemKeyForRow(entry) {
        var menuItem = menuByZhMap[entry.nameZh];
        if (menuItem && menuItem.id) return menuItem.id;
        return "zh:" + entry.nameZh;
      }

      function baseRegionData(menuItem, regionId) {
        if (!menuItem || !menuItem.regions) return { rank: null, priceL: null };
        var r = menuItem.regions[regionId];
        if (!r || r.rank == null) return { rank: null, priceL: null };
        return { rank: Number(r.rank), priceL: r.priceL != null ? Number(r.priceL) : null };
      }

      function loadOverrides() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return Object.create(null);
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return Object.create(null);
          return parsed;
        } catch (e) {
          return Object.create(null);
        }
      }

      function saveOverrides() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(overrides));
        } catch (e) {
          /* ignore */
        }
      }

      function effectiveData(itemKey, regionId, menuItem) {
        var key = storageKey(itemKey, regionId);
        if (Object.prototype.hasOwnProperty.call(overrides, key)) {
          return {
            rank: overrides[key].rank,
            priceL: overrides[key].priceL,
          };
        }
        return baseRegionData(menuItem, regionId);
      }

      function isModified(itemKey, regionId, menuItem) {
        var key = storageKey(itemKey, regionId);
        if (!Object.prototype.hasOwnProperty.call(overrides, key)) return false;
        var base = baseRegionData(menuItem, regionId);
        var cur = overrides[key];
        return cur.rank !== base.rank || cur.priceL !== base.priceL;
      }

      function setOverride(itemKey, regionId, menuItem, rank, priceL) {
        var key = storageKey(itemKey, regionId);
        var base = baseRegionData(menuItem, regionId);
        if (rank === base.rank && priceL === base.priceL) {
          delete overrides[key];
        } else {
          overrides[key] = { rank: rank, priceL: priceL };
        }
        saveOverrides();
      }

      function parseRankInput(raw) {
        var s = String(raw == null ? "" : raw).trim();
        if (s === "") return { ok: true, value: null };
        var n = Number(s);
        if (!Number.isInteger(n) || n < 1 || n > 10) {
          return { ok: false, message: "排名須為 1–10 或空白" };
        }
        return { ok: true, value: n };
      }

      function parsePriceInput(raw, hasRank) {
        var s = String(raw == null ? "" : raw).trim();
        if (s === "") {
          if (hasRank) return { ok: false, message: "有排名時須填價格" };
          return { ok: true, value: null };
        }
        var n = Number(s);
        if (!Number.isFinite(n) || n < 0 || Math.floor(n) !== n) {
          return { ok: false, message: "價格須為 0 以上整數" };
        }
        return { ok: true, value: n };
      }

      function collectRegionValues(regionId) {
        var list = [];
        catalogItems.forEach(function (entry) {
          var itemKey = itemKeyForRow(entry);
          var menuItem = menuByZhMap[entry.nameZh] || null;
          var data = effectiveData(itemKey, regionId, menuItem);
          if (data.rank != null) {
            list.push({ itemKey: itemKey, rank: data.rank });
          }
        });
        return list;
      }

      function validateRegion(regionId) {
        var ranked = collectRegionValues(regionId);
        var errors = Object.create(null);
        var rankCount = Object.create(null);
        ranked.forEach(function (row) {
          var r = row.rank;
          if (!rankCount[r]) rankCount[r] = [];
          rankCount[r].push(row.itemKey);
        });
        Object.keys(rankCount).forEach(function (rank) {
          if (rankCount[rank].length > 1) {
            rankCount[rank].forEach(function (itemKey) {
              var k = itemKey + "|" + regionId;
              errors[k] = "排名 " + rank + " 重複";
            });
          }
        });
        if (ranked.length > 10) {
          catalogItems.forEach(function (entry) {
            var itemKey = itemKeyForRow(entry);
            var menuItem = menuByZhMap[entry.nameZh] || null;
            var data = effectiveData(itemKey, regionId, menuItem);
            if (data.rank != null) {
              errors[itemKey + "|" + regionId] = "該區最多 10 品";
            }
          });
        }
        return errors;
      }

      function validateAllRegions() {
        var merged = Object.create(null);
        regionIds.forEach(function (rid) {
          var regErr = validateRegion(rid);
          Object.keys(regErr).forEach(function (k) {
            merged[k] = regErr[k];
          });
        });
        return merged;
      }

      function showLoadError(msg) {
        var el = document.getElementById("load-error");
        if (!el) return;
        el.hidden = false;
        el.textContent = msg;
      }

      function updateBanners(allErrors) {
        var validateEl = document.getElementById("validate-banner");
        var statusEl = document.getElementById("status-banner");
        var keys = Object.keys(allErrors);
        if (validateEl) {
          if (keys.length) {
            validateEl.hidden = false;
            validateEl.textContent =
              "檢查未通過（" +
              keys.length +
              " 格）：同一區域排名不可重複、最多 10 品；有排名須填價格。";
          } else {
            validateEl.hidden = true;
          }
        }
        if (statusEl) {
          var modCount = Object.keys(overrides).length;
          if (!keys.length) {
            statusEl.hidden = false;
            statusEl.textContent =
              modCount > 0
                ? "目前有效；已修改 " + modCount + " 格（仅存於本機）。"
                : "目前有效；與 menu.json 預設一致。";
          } else {
            statusEl.hidden = true;
          }
        }
      }

      function applyCellValidation(inputs, message) {
        inputs.rank.classList.toggle("is-invalid", !!message);
        inputs.price.classList.toggle("is-invalid", !!message);
        inputs.err.textContent = message || "";
      }

      function refreshColumnHeaders(allErrors) {
        regionIds.forEach(function (rid) {
          var th = document.querySelector('th[data-region-id="' + rid + '"]');
          if (!th) return;
          var has = false;
          catalogItems.forEach(function (entry) {
            var itemKey = itemKeyForRow(entry);
            if (allErrors[itemKey + "|" + rid]) has = true;
          });
          th.classList.toggle("has-col-error", has);
        });
      }

      function bindCellInputs(td, entry, regionId) {
        var itemKey = itemKeyForRow(entry);
        var menuItem = menuByZhMap[entry.nameZh] || null;
        var data = effectiveData(itemKey, regionId, menuItem);

        var rankInput = td.querySelector(".rank-input");
        var priceInput = td.querySelector(".price-input");
        var errSpan = td.querySelector(".cell-err");
        var inputs = { rank: rankInput, price: priceInput, err: errSpan };

        function syncModifiedClass() {
          var modified = isModified(itemKey, regionId, menuItem);
          rankInput.classList.toggle("is-modified", modified);
          priceInput.classList.toggle("is-modified", modified);
        }

        function commit() {
          var rankParsed = parseRankInput(rankInput.value);
          if (!rankParsed.ok) {
            applyCellValidation(inputs, rankParsed.message);
            return;
          }
          var priceParsed = parsePriceInput(priceInput.value, rankParsed.value != null);
          if (!priceParsed.ok) {
            applyCellValidation(inputs, priceParsed.message);
            return;
          }
          if (rankParsed.value == null && priceParsed.value != null) {
            applyCellValidation(inputs, "無排名時不可填價格");
            return;
          }
          setOverride(itemKey, regionId, menuItem, rankParsed.value, priceParsed.value);
          syncModifiedClass();
          var allErrors = validateAllRegions();
          catalogItems.forEach(function (e2) {
            regionIds.forEach(function (rid2) {
              var ik = itemKeyForRow(e2);
              var cell = document.querySelector(
                'td[data-item-key="' + ik + '"][data-region-id="' + rid2 + '"]'
              );
              if (!cell) return;
              var msg = allErrors[ik + "|" + rid2] || "";
              var ri = cell.querySelector(".rank-input");
              var pi = cell.querySelector(".price-input");
              var es = cell.querySelector(".cell-err");
              if (!msg) {
                ri.classList.remove("is-invalid");
                pi.classList.remove("is-invalid");
                if (!es.textContent || es.textContent.indexOf("排名") >= 0 || es.textContent.indexOf("價格") >= 0 || es.textContent.indexOf("最多") >= 0) {
                  es.textContent = "";
                }
              } else {
                ri.classList.add("is-invalid");
                pi.classList.add("is-invalid");
                es.textContent = msg;
              }
            });
          });
          applyCellValidation(inputs, allErrors[itemKey + "|" + regionId] || "");
          updateBanners(allErrors);
          refreshColumnHeaders(allErrors);
        }

        rankInput.addEventListener("change", commit);
        priceInput.addEventListener("change", commit);
        rankInput.addEventListener("blur", commit);
        priceInput.addEventListener("blur", commit);
        syncModifiedClass();
      }

      function createEditCell(entry, regionId) {
        var itemKey = itemKeyForRow(entry);
        var menuItem = menuByZhMap[entry.nameZh] || null;
        var data = effectiveData(itemKey, regionId, menuItem);
        var td = document.createElement("td");
        td.className = "cell-edit-wrap";
        td.setAttribute("data-item-key", itemKey);
        td.setAttribute("data-region-id", regionId);
        td.innerHTML =
          '<div class="cell-edit">' +
          '<label>排名<input type="number" class="rank-input" min="1" max="10" step="1" value="' +
          (data.rank != null ? escapeHtml(data.rank) : "") +
          '" aria-label="排名" /></label>' +
          '<label>$L<input type="number" class="price-input" min="0" step="1" value="' +
          (data.priceL != null ? escapeHtml(data.priceL) : "") +
          '" aria-label="大杯價" /></label>' +
          '<span class="cell-err" role="alert"></span></div>';
        bindCellInputs(td, entry, regionId);
        return td;
      }

      function renderMatrix() {
        var thead = document.getElementById("matrix-thead");
        var tbody = document.getElementById("matrix-tbody");
        if (!thead || !tbody) return;

        var headRow = document.createElement("tr");
        headRow.innerHTML = '<th scope="col">飲料</th>';
        regionIds.forEach(function (rid) {
          var th = document.createElement("th");
          th.scope = "col";
          th.className = "region-col";
          th.setAttribute("data-region-id", rid);
          th.textContent = LABELS[rid] || rid;
          headRow.appendChild(th);
        });
        thead.innerHTML = "";
        thead.appendChild(headRow);

        tbody.innerHTML = "";
        catalogItems.forEach(function (entry) {
          var tr = document.createElement("tr");
          var menuItem = menuByZhMap[entry.nameZh] || null;
          var drinkTd = document.createElement("td");
          drinkTd.className = "col-drink";
          drinkTd.innerHTML =
            '<div class="name-zh">' +
            escapeHtml(entry.nameZh) +
            '</div><div class="name-en">' +
            escapeHtml(entry.nameEn || (menuItem && menuItem.nameEn) || "") +
            "</div>";
          tr.appendChild(drinkTd);
          regionIds.forEach(function (rid) {
            tr.appendChild(createEditCell(entry, rid));
          });
          tbody.appendChild(tr);
        });

        var allErrors = validateAllRegions();
        updateBanners(allErrors);
        refreshColumnHeaders(allErrors);
      }

      function dedupeCatalog(items) {
        var seen = Object.create(null);
        var out = [];
        (items || []).forEach(function (entry) {
          var zh = (entry && entry.nameZh) || "";
          if (!zh || seen[zh]) return;
          seen[zh] = true;
          out.push({
            nameZh: zh,
            nameEn: (entry && entry.nameEn) || "",
          });
        });
        return out;
      }

      function buildMenuByZh(menu) {
        var map = Object.create(null);
        (menu.items || []).forEach(function (item) {
          if (item.nameZh && !map[item.nameZh]) map[item.nameZh] = item;
        });
        return map;
      }

      function boot() {
        document.getElementById("btn-reset").addEventListener("click", function () {
          overrides = Object.create(null);
          saveOverrides();
          renderMatrix();
        });

        overrides = loadOverrides();

        Promise.all([
          fetch(ASSET_ROOT + "data/menu.json", { cache: "no-cache" }),
          fetch(ASSET_ROOT + "data/client-drink-catalog.json", { cache: "no-cache" }),
        ])
          .then(function (responses) {
            if (!responses[0].ok) throw new Error("menu.json HTTP " + responses[0].status);
            if (!responses[1].ok) {
              throw new Error("client-drink-catalog.json HTTP " + responses[1].status);
            }
            return Promise.all([responses[0].json(), responses[1].json()]);
          })
          .then(function (payload) {
            menuData = payload[0];
            regionIds = menuData.regions || [];
            catalogItems = dedupeCatalog(payload[1].items);
            menuByZhMap = buildMenuByZh(menuData);
            renderMatrix();
          })
          .catch(function (err) {
            showLoadError(
              "無法載入資料：" +
                (err && err.message ? err.message : String(err)) +
                "。請以 HTTP 開啟。"
            );
          });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
